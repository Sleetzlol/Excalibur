<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b1020">
<title>Excalibur</title>
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700;9..40,800&display=swap" rel="stylesheet">



<style>
:root{
  --bg:#02040c; --panel:rgba(9,18,52,.68); --panel2:rgba(22,38,92,.78); --line:rgba(120,160,255,.24);
  --text:#e8ecf6; --mute:#8d98b5; --gold:#f2b84b; --steel:#7fa8ff; --bad:#ff7a7a; --good:#6fdc9a;
  --head:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:linear-gradient(160deg,#02040c 0%,#06103a 50%,#0b2270 100%) fixed;color:var(--text);font:400 15px/1.5 var(--body);
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
.app{display:grid;grid-template-columns:220px 1fr;height:100%}
nav{background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px}
.logo{font:800 22px var(--head);letter-spacing:.3px;padding:0 10px 18px}
.logo b{color:var(--gold);font-weight:800}
nav button{background:none;text-align:left;padding:10px 12px;border-radius:10px;color:var(--mute);font-weight:500}
nav button:hover{background:var(--panel2);color:var(--text)}
nav button.on{background:var(--panel2);color:var(--text);box-shadow:inset 3px 0 0 var(--gold)}
.me{margin-top:auto;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:13px;color:var(--mute)}
.me strong{display:block;color:var(--text);font-size:15px;cursor:pointer}
main{display:flex;flex-direction:column;min-width:0;height:100%}
header{display:flex;gap:12px;align-items:center;padding:16px 24px;border-bottom:1px solid var(--line)}
header input{flex:1;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.coins{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 8px 6px 14px;font-weight:700}
.coins i{width:14px;height:14px;border-radius:50%;background:var(--gold);box-shadow:inset -2px -2px 0 #c48a1e}
.coins button{background:var(--gold);color:#201500;border-radius:999px;padding:4px 12px;font-weight:700;font-size:13px}
.coins button:disabled{background:var(--line);color:var(--mute);cursor:default}
.view{flex:1;overflow:auto;padding:24px}
h1{font:800 28px var(--head);margin-bottom:4px}
.sub{color:var(--mute);margin-bottom:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chip{background:var(--panel);border:1px solid var(--line);color:var(--mute);padding:6px 14px;border-radius:999px}
.chip.on{background:var(--steel);border-color:var(--steel);color:#08142e;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column}
.card:hover{border-color:var(--steel)}
.card .art{height:100px;display:grid;place-items:center;font:800 34px var(--head);color:rgba(255,255,255,.9)}
.card .txt{padding:12px 14px}
.card strong{display:block}
.card span{color:var(--mute);font-size:13px}
.tag{display:inline-block;margin-top:6px;font-size:12px;color:var(--gold)}
.card.soon{opacity:.55;cursor:default}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:560px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.btn{background:var(--steel);color:#08142e;font-weight:700;padding:10px 18px;border-radius:10px}
.btn.alt{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:#201500}
.btn:disabled{opacity:.4;cursor:default}
.back{background:none;color:var(--mute);margin-bottom:14px;padding:0}
.back:hover{color:var(--text)}
.bar{height:6px;background:var(--panel2);border-radius:6px;overflow:hidden;max-width:560px;margin:0 0 18px}
.bar div{height:100%;width:0;background:var(--gold)}
.big{font:800 54px var(--head);margin:6px 0}
input.num{width:110px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.msgs{height:340px;overflow:auto;display:flex;flex-direction:column;gap:8px;margin:12px 0}
.msg b{color:var(--steel)}
.note{color:var(--mute);font-size:13px;margin-top:12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--gold);padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:1fr auto}
  nav{order:2;flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:8px;justify-content:space-around}
  .logo,.me{display:none}
  nav button{text-align:center;padding:10px 14px}
  nav button.on{box-shadow:inset 0 3px 0 var(--gold)}
  header{padding:12px 14px}.view{padding:16px}
}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
nav,header,.card,.panel{backdrop-filter:blur(10px)}
h1,.logo{background:linear-gradient(90deg,#fff,#9fc0ff,#f2b84b,#fff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s linear infinite}
.logo b{color:var(--gold)}
@keyframes shine{to{background-position:-300% 0}}
#daily:not(:disabled){animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(242,184,75,.7)}70%,100%{box-shadow:0 0 0 12px rgba(242,184,75,0)}}
.coins{box-shadow:0 0 22px rgba(242,184,75,.16)}
.lv{margin-top:10px;font-size:12px;color:var(--gold);font-weight:700}
.xp{height:6px;background:rgba(255,255,255,.1);border-radius:6px;overflow:hidden;margin-top:4px}
.xp div{height:100%;width:0;background:linear-gradient(90deg,var(--steel),var(--gold));transition:width .5s}
.chip{transition:transform .15s,background .2s}
.chip:hover{transform:translateY(-2px)}
.card .art{background-size:200% 200%!important;animation:flow 7s ease infinite;transition:font-size .2s}
@keyframes flow{50%{background-position:100% 100%}}
.card:hover .art{font-size:50px}
.card:not(.soon):hover{border-color:hsl(var(--h,220) 85% 65%);box-shadow:0 14px 34px rgba(0,0,0,.5),0 0 28px hsl(var(--h,220) 85% 55%/.45)}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;transform:translateX(-120%);animation:gloss 6s ease-in-out infinite;
  background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.12) 50%,transparent 58%)}
@keyframes gloss{60%,100%{transform:translateX(120%)}}
.spark{position:fixed;z-index:20;width:6px;height:6px;border-radius:50%;pointer-events:none;animation:spark .65s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
.toast.show{animation:tin .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes tin{from{transform:translateX(-50%) translateY(24px) scale(.9)}}
.view{animation:viewin .35s ease}
@keyframes viewin{from{opacity:0;transform:translateY(8px)}}
nav button{transition:background .2s,color .2s,transform .15s}
nav button:hover{transform:translateX(3px)}
.btn{transition:transform .12s,filter .2s}
.btn:hover:not(:disabled){filter:brightness(1.12)}
.btn:active:not(:disabled){transform:scale(.94)}
.card{position:relative;transition:transform .22s,box-shadow .22s,border-color .22s;animation:pop .5s both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.95)}}
.card:not(.soon):hover{transform:translateY(-6px);box-shadow:0 14px 32px rgba(0,0,0,.5)}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;transform:translateX(-120%);transition:transform .6s;
  background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.15) 50%,transparent 60%)}
.card:not(.soon):hover::after{transform:translateX(120%)}
.card .art{position:relative;overflow:hidden;text-shadow:0 4px 22px rgba(0,0,0,.45);font-size:40px}
.card .art::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.06) 0 10px,transparent 10px 20px)}
.hero{position:relative;overflow:hidden;border-radius:18px;padding:30px 34px;margin-bottom:26px;border:1px solid var(--line);
  background:linear-gradient(120deg,#1b2a66,#34206a 60%,#58284f);display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.hero::before{content:"";position:absolute;width:320px;height:320px;right:-60px;top:-90px;border-radius:50%;
  background:radial-gradient(circle,rgba(242,184,75,.4),transparent 65%);animation:pulse 4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.25);opacity:.6}}
.hero h2{font:800 32px var(--head);line-height:1.1}
.hero p{color:#cfd6ee;max-width:420px;margin-top:8px}
.hero .tag{background:rgba(0,0,0,.3);padding:4px 12px;border-radius:999px;margin-top:14px}
@keyframes bob{50%{transform:translateY(-10px) rotate(4deg)}}
.coins i.spin{animation:spin .6s}
@keyframes spin{to{transform:rotateY(360deg)}}
.float{position:fixed;z-index:20;pointer-events:none;font:800 20px var(--head);color:var(--gold);animation:rise .9s ease-out forwards}
@keyframes rise{to{transform:translateY(-60px);opacity:0}}
.shake{animation:shake .16s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.coin3d{width:110px;height:110px;margin:16px 0;perspective:600px}
.coin3d div{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;font:800 20px var(--head);color:#201500;
  background:radial-gradient(circle at 30% 30%,#ffe29a,var(--gold) 55%,#b97d14);box-shadow:inset 0 0 0 6px rgba(0,0,0,.12),0 8px 26px rgba(242,184,75,.35)}
.coin3d.flip div{animation:flip 1s cubic-bezier(.3,.6,.3,1)}
@keyframes flip{to{transform:translateY(0) rotateY(1080deg)}}
nav button.logo,nav button.logo:hover{background:linear-gradient(90deg,#fff,#9fc0ff,#f2b84b,#fff) 0 0/300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
nav button.logo:hover{transform:scale(1.05)}
.mhome{display:none;font:800 18px var(--head);background:linear-gradient(90deg,#fff,#9fc0ff,#f2b84b,#fff) 0 0/300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s linear infinite}
@media (max-width:760px){.mhome{display:block}}
.title{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;
  transition:opacity .4s,transform .4s,visibility 0s}
.title.hide{opacity:0;transform:scale(1.06);pointer-events:none;visibility:hidden;transition:opacity .4s,transform .4s,visibility 0s .4s}
body.on-title .app{visibility:hidden}
@keyframes sworddrop{from{transform:translateY(-90px) rotate(-25deg);opacity:0}}
.tt{font:800 clamp(52px,13vw,128px)/1.05 var(--head);background:linear-gradient(90deg,#fff,#9fc0ff,#f2b84b,#fff);background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 26px rgba(127,168,255,.5));
  animation:shine 7s linear infinite,tin2 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes tin2{from{opacity:0;letter-spacing:.35em;filter:blur(12px)}}
.tsub{color:#cfd6ee;font-size:18px;animation:fadeup .8s .5s both}
.menu{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:10px;animation:fadeup .8s .8s both}
.menu .btn{padding:14px 28px;font-size:16px}
.thint{color:var(--mute);font-size:13px;animation:fadeup .8s 1.1s both}
@keyframes fadeup{from{opacity:0;transform:translateY(14px)}}
html,body{overflow:hidden}
body{height:100vh;height:100dvh}
.app{grid-template-rows:minmax(0,1fr)}
main{min-height:0;overflow:hidden}
nav{overflow-y:auto;min-height:0}
.view{min-height:0;overscroll-behavior:contain}
.title{overflow:auto}
.tt{font-size:clamp(44px,min(13vw,16vh),128px)}
@media (max-width:760px){.app{grid-template-rows:minmax(0,1fr) auto}nav{overflow-x:auto;overflow-y:hidden}}
@media (max-height:620px){
  .title{gap:8px}.tsub{font-size:15px}.menu .btn{padding:10px 20px}
  .hero{padding:18px 22px;margin-bottom:16px}.hero h2{font-size:24px}
  header{padding:10px 16px}.view{padding:16px}.big{font-size:40px}
}
.lobby{width:min(100%,max(320px,calc((100dvh - 250px)*16/9)));max-width:960px;aspect-ratio:16/9;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#000;box-shadow:0 10px 40px rgba(0,0,0,.45)}
.lobby canvas{width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
.lobby{position:relative}
.pp{position:absolute;right:12px;top:12px;width:250px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px;backdrop-filter:blur(8px);z-index:2;font-size:14px}
.slot{padding:7px 10px;margin-top:6px;background:rgba(255,255,255,.06);border-radius:8px}
.info{display:grid;grid-template-columns:minmax(0,260px) 1fr;gap:28px;max-width:860px;align-items:start}
.iart{aspect-ratio:1;border-radius:18px;display:grid;place-items:center;font-size:90px;border:1px solid var(--line)}
.info h3{font:700 16px var(--head);margin:16px 0 6px}
.how{padding-left:20px;color:var(--mute);margin-bottom:20px}
@media (max-width:760px){.info{grid-template-columns:1fr}.iart{max-width:180px;font-size:70px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

.hero{background:linear-gradient(120deg,#16306e,#2a2a78 55%,#1b5a86)}
.hero .ann{margin:0 0 10px;background:rgba(242,184,75,.18);color:var(--gold);font-weight:700}
.hero .v2{position:relative;font:800 72px/1 var(--head);color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.55);background:linear-gradient(90deg,#fff,#9fc0ff,#f2b84b);-webkit-background-clip:text;background-clip:text;animation:bob 3.5s ease-in-out infinite;padding-right:10px}
@keyframes bob{50%{transform:translateY(-8px)}}
.lobby{width:100%;max-width:none;aspect-ratio:16/9;border-radius:12px;background:#dfe9f6}
.win{position:fixed;z-index:40;display:flex;flex-direction:column;background:rgba(8,14,40,.94);border:1px solid var(--line);border-radius:14px;overflow:hidden;
  box-shadow:0 24px 60px rgba(0,0,0,.6);backdrop-filter:blur(14px);animation:winin .22s cubic-bezier(.2,.9,.3,1.1)}
@keyframes winin{from{opacity:0;transform:scale(.94) translateY(10px)}}
.win.focus{border-color:rgba(127,168,255,.6);box-shadow:0 24px 60px rgba(0,0,0,.6),0 0 0 1px rgba(127,168,255,.25)}
.win.min{display:none}
.win.max,.win:fullscreen{left:0!important;top:0!important;width:100%!important;height:calc(100% - 52px)!important;border-radius:0}
.win:fullscreen{height:100%!important}
.wbar{display:flex;align-items:center;gap:4px;padding:6px 6px 6px 12px;background:rgba(22,38,92,.9);border-bottom:1px solid var(--line);cursor:grab;user-select:none;touch-action:none}
.wtitle{font:700 14px var(--head);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:6px}
.wzoom{font-size:12px;color:var(--mute);margin-right:4px}
.wbar button{width:32px;height:28px;border-radius:8px;background:rgba(255,255,255,.06);color:var(--text);font-size:14px;line-height:1}
.wbar button:hover{background:rgba(255,255,255,.16)}
.wbar .wx:hover{background:#e0484d}
.wbody{flex:1;overflow:auto;padding:14px;min-height:0}
.wzoomer{height:100%}
.wframe{width:100%;height:100%;border:0;border-radius:10px;background:#000}
.wgrip{position:absolute;right:0;bottom:0;width:18px;height:18px;cursor:nwse-resize;touch-action:none;background:linear-gradient(135deg,transparent 50%,rgba(127,168,255,.5) 50%)}
body.dragging{user-select:none}body.dragging iframe{pointer-events:none}
.taskbar{position:fixed;left:50%;bottom:8px;transform:translateX(-50%) translateY(80px);z-index:9000;display:flex;gap:6px;padding:6px;max-width:calc(100% - 16px);overflow-x:auto;
  background:rgba(8,14,40,.88);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(14px);transition:transform .25s}
.taskbar.show{transform:translateX(-50%)}
.task{background:rgba(255,255,255,.06);padding:7px 14px;border-radius:9px;white-space:nowrap;font-weight:500;font-size:14px}
.task:hover{background:rgba(255,255,255,.14)}
.task.on{background:var(--panel2);box-shadow:inset 0 -2px 0 var(--gold)}
.task.mini{opacity:.6}
.task.closeall{color:var(--bad)}

.lobby{background:#8fbdf0}
.lpanel{position:absolute;inset:14px;z-index:3;background:rgba(10,18,50,.94);border:1px solid var(--line);border-radius:14px;padding:18px 20px;overflow:auto;backdrop-filter:blur(10px)}
.lpanel h2{font:800 22px var(--head)}
.lx{position:absolute;right:10px;top:10px;width:32px;height:32px;border-radius:8px;background:rgba(255,255,255,.08)}
.lx:hover{background:#e0484d}
.locker{display:grid;grid-template-columns:220px 1fr;gap:20px;align-items:start}
.lprev{background:radial-gradient(circle at 50% 70%,#2b4a9a,#121c48);border:1px solid var(--line);border-radius:14px;text-align:center;padding-bottom:10px}
.lprev canvas{display:block;width:100%;height:auto}
.lname{font-weight:700}
.lright .chips{margin:10px 0 12px}
.lstyle{display:flex;align-items:center;gap:4px;margin:8px 0 6px;font:700 12px var(--body,sans-serif);color:var(--mut,#9aa6c4)}.lstyle span{margin-right:4px}
.lstyle button{padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.07);color:#fff;border:1px solid rgba(255,255,255,.15);font:700 12px var(--body,sans-serif)}.lstyle button.on{background:#f2b84b;color:#201500;border-color:#f2b84b}
.lkfx{font-size:12px;min-height:30px;padding:4px 10px}
.litems{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin:8px 0}
.citem{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.citem:hover{border-color:var(--steel)}
.citem.on{border-color:var(--gold);background:rgba(242,184,75,.12)}
.citem strong{font-size:13px}.citem span{font-size:12px;color:var(--gold)}
.cic{width:42px;height:42px;display:grid;place-items:center;font-size:28px}
.cic.sw{border-radius:50%;box-shadow:inset -4px -5px 0 rgba(0,0,0,.2)}
.citem.sm .cic{width:30px;height:30px;font-size:20px}
.trade{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.tslots{min-height:70px;margin-top:6px;border:1px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.tempty{color:var(--mute);font-size:13px}
.tchip{background:var(--panel2);padding:4px 10px;border-radius:999px;font-size:13px}
@media (max-width:640px){.locker{grid-template-columns:1fr}.lprev{max-width:200px}.trade{grid-template-columns:1fr}}
.abtn.rainbow,.citem.rainbow{border-color:transparent;background:linear-gradient(120deg,rgba(255,59,59,.18),rgba(255,233,59,.18),rgba(59,214,255,.18),rgba(217,75,255,.18))}
.bw{position:relative;overflow:hidden}
.bwshop,.bwend{position:absolute;z-index:5;left:50%;top:50%;transform:translate(-50%,-50%);width:min(94%,540px);max-height:92%;overflow:auto;background:rgba(10,18,50,.96);border:1px solid var(--line);border-radius:14px;padding:14px 16px;backdrop-filter:blur(8px);box-shadow:0 20px 50px rgba(0,0,0,.5)}
.bwshop[hidden],.bwend[hidden]{display:none}
.bwtop{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.bwtop span{color:var(--mute);font-size:13px;flex:1}
.bwx{width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.08);color:var(--text)}.bwx:hover{background:#e0484d}
.bwtabs{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}

/* ===== V3 look: deeper colours, softer glass panels, richer cards (overrides the older rules above) ===== */
:root{--panel:rgba(12,20,56,.62);--panel2:rgba(28,44,104,.72);--line:rgba(140,170,255,.18);--glow:0 18px 50px rgba(0,0,0,.45)}
body{background:radial-gradient(1200px 700px at 85% -10%,rgba(155,92,255,.25),transparent 60%),radial-gradient(900px 600px at -10% 110%,rgba(79,140,255,.22),transparent 60%),linear-gradient(160deg,#03050f 0%,#070f36 55%,#0b1c5c 100%) fixed}
nav{background:linear-gradient(180deg,rgba(14,22,62,.82),rgba(8,14,42,.82));border-right:1px solid var(--line)}
nav button{font-weight:600;letter-spacing:.1px;display:flex;align-items:center;gap:6px}
nav button.on{background:linear-gradient(90deg,rgba(79,140,255,.28),rgba(155,92,255,.14));box-shadow:inset 3px 0 0 var(--gold),0 6px 18px rgba(0,0,0,.25)}
.logo{font-size:24px}
header{background:rgba(6,10,30,.35);backdrop-filter:blur(12px)}
.panel{border-radius:18px;background:linear-gradient(180deg,rgba(20,30,76,.72),rgba(10,18,50,.72));box-shadow:var(--glow)}
.btn{border-radius:12px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.btn.gold{background:linear-gradient(180deg,#ffd77a,#f2b84b 55%,#e0a033);color:#241600;box-shadow:0 6px 18px rgba(242,184,75,.28),inset 0 1px 0 rgba(255,255,255,.5)}
.btn:not(.alt):not(.gold){background:linear-gradient(180deg,#9fc0ff,#6f9bff);color:#08142e}
.card{border-radius:18px;background:linear-gradient(180deg,rgba(20,30,76,.75),rgba(10,16,46,.85))}
.card .art{height:118px;font-size:46px}
.card .txt{padding:12px 14px 14px}.card strong{font:800 16px var(--head)}
.coins #daily{background:linear-gradient(180deg,#ffd77a,#f2b84b);color:#241600}
.coins #daily:not(.ready){background:rgba(255,120,60,.18);color:#ffb37a;border:1px solid rgba(255,140,80,.4);animation:none}
#daily.ready{animation:ping 2s infinite}
/* home dashboard */
.dash{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;margin-bottom:26px}
.dhero{position:relative;overflow:hidden;border-radius:22px;padding:26px 28px;border:1px solid var(--line);background:linear-gradient(125deg,#1d2d72,#3a2275 55%,#6a2a5a);box-shadow:var(--glow)}
.dhero::before{content:"";position:absolute;width:360px;height:360px;right:-90px;top:-120px;border-radius:50%;background:radial-gradient(circle,rgba(242,184,75,.45),transparent 65%);animation:pulse 4s ease-in-out infinite}
.dhero h2{font:800 30px/1.1 var(--head);position:relative}.dhero p{position:relative;color:#d7ddf3;margin-top:6px;max-width:440px}
.dchips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;position:relative}
.dchip{background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px}
.dbtns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;position:relative}
.dside{display:flex;flex-direction:column;gap:12px}
.dq{border-radius:18px;padding:14px 16px;border:1px solid var(--line);background:linear-gradient(180deg,rgba(20,30,76,.72),rgba(10,18,50,.72))}
.dq h3{font:800 16px var(--head);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}.dq h3 button{font-size:12px;padding:4px 10px;min-height:0}
.dqi{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:13px}.dqi .grow{flex:1;min-width:0}.dqi .qbar{margin-top:3px}
.dav{display:flex;align-items:center;gap:12px}.dav canvas{width:84px;height:94px;flex:none}
@media (max-width:900px){.dash{grid-template-columns:1fr}}
/* rewards page */
.rgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start}
.rpan{max-width:none}.rpan h2{font:800 20px var(--head);margin-bottom:10px}
.sdays{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:6px}
.sday{border-radius:12px;padding:8px 2px;text-align:center;background:rgba(255,255,255,.05);border:1px solid var(--line)}.sday small{display:block;font-size:10px;color:var(--mute)}.sday b{font-size:13px}
.sday.got{background:rgba(242,184,75,.2);border-color:rgba(242,184,75,.6)}.sday.today{outline:2px solid var(--gold);animation:ping 2s infinite}
.qrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.06)}.qrow .grow{flex:1;min-width:0}.qrow small{color:var(--mute);font-size:12px}
.qic{font-size:24px;width:34px;text-align:center}
.qbar{height:7px;border-radius:7px;background:rgba(255,255,255,.1);overflow:hidden;margin:5px 0 3px}.qbar i{display:block;height:100%;background:linear-gradient(90deg,#6f9bff,#f2b84b);border-radius:7px}
.tiers{display:flex;gap:10px;flex-wrap:wrap;font-weight:700;font-size:12px;margin-top:6px}
.road{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.rstep{border-radius:12px;padding:10px 6px;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--text);text-align:center}.rstep b{display:block;font:800 15px var(--head)}.rstep small{font-size:11px;color:var(--mute)}
.rstep.got{background:rgba(111,220,154,.14);border-color:rgba(111,220,154,.5)}.rstep.ready{background:rgba(242,184,75,.2);border-color:var(--gold);animation:ping 2s infinite}.rstep:disabled{cursor:default}
/* mystery crate opening */
.crate{position:fixed;inset:0;z-index:9700;background:rgba(3,6,20,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:20px;animation:viewin .3s}
.crate .chd{font:800 30px var(--head);color:#ffe28a}
.creel{position:relative;width:min(640px,92vw);height:110px;overflow:hidden;border-radius:16px;border:2px solid rgba(242,184,75,.6);background:rgba(10,16,44,.9)}
.creel::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:#ffe28a;box-shadow:0 0 12px #ffe28a}
.cstrip{display:flex;gap:12px;padding:10px;transition:transform 3.1s cubic-bezier(.12,.75,.12,1)}
.ccell{flex:none;width:80px;height:88px;border-radius:12px;background:rgba(255,255,255,.06);border-bottom:4px solid var(--tc);display:grid;place-items:center}.ccell canvas{width:64px;height:64px}
.ccell.cwin{background:rgba(242,184,75,.25);box-shadow:0 0 24px var(--tc)}
.cres{min-height:120px;text-align:center}.cres .ctier{font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:13px;color:var(--mute)}.cres .cname{font:800 32px var(--head);margin:4px 0}
/* cosmetics locker as a window from anywhere */
.lockm{position:fixed;inset:0;z-index:9500;background:rgba(3,6,20,.8);display:flex;align-items:center;justify-content:center;padding:16px}
.lockm .lin{position:relative;width:min(980px,100%);max-height:100%;overflow:auto;background:linear-gradient(180deg,#121c4c,#0a1236);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--glow)}
.lockm .lx{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.1)}
.title .tt{filter:drop-shadow(0 10px 40px rgba(127,168,255,.35))}
@media (max-width:760px){nav{overflow-x:auto;justify-content:flex-start;gap:2px;scrollbar-width:none}nav::-webkit-scrollbar{display:none}nav button{flex:none;padding:8px 11px;font-size:13px;flex-direction:column;gap:2px}
  .dhero{padding:18px}.dhero h2{font-size:22px}.dav canvas{width:64px;height:72px}.dbtns .btn{padding:8px 12px;font-size:14px}.sdays{gap:3px}.sday b{font-size:11px}}
.tstreak{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.tstreak span{background:rgba(255,255,255,.08);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:700;font-size:13px}


.pmhead{display:flex;gap:12px;align-items:center;margin-bottom:12px}
.pmhead canvas{width:72px;height:72px;background:radial-gradient(circle,#243055,#141a2e);border-radius:16px;flex:none}
.pmgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pmgrid .btn{text-align:left;min-height:44px}
.pmlook{margin-top:12px;padding:10px;border-radius:12px;background:rgba(242,184,75,.07);border:1px solid rgba(242,184,75,.25)}
.pmlook .note{margin:0 0 8px}
.pmrow{display:flex;gap:10px;align-items:center;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:6px 10px;margin-bottom:6px;font:inherit;cursor:pointer;min-height:48px}
.pmrow:hover{border-color:var(--gold)}
.pmrow canvas{width:36px;height:36px;flex:none}
.rpwrap{margin-top:8px}.rpcv{width:100%;aspect-ratio:16/9;border-radius:10px;background:#0a0f22;display:block}.rpctl{margin-top:6px;align-items:center;flex-wrap:nowrap}
.wbar .wppl{order:0;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;height:32px;padding:0 11px;margin-right:6px;font:700 13px var(--head);color:#fff;background:rgba(8,12,34,.55);border:1px solid rgba(255,255,255,.2);border-radius:10px;cursor:pointer;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.wbar .wppl[hidden]{display:none}
.win.page.playing .wbar{display:flex;align-items:center}
@media (max-width:640px){.pmgrid{grid-template-columns:1fr}}

/* game library: thumbnail cards and full-page game frames */
.card .art.thumb{padding:0;font-size:0}
.card .art.thumb::before{display:none}
.card .art.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s}
.card:hover .art.thumb img{transform:scale(1.05)}
.win.page.framed .wbody{padding:0;overflow:hidden}
.win.page.framed .wframe{border-radius:0;display:block}
/* settings */
.setgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin:10px 0}
.seticon{aspect-ratio:1;background:var(--panel2);border:1px solid var(--line);border-radius:12px;display:grid;place-items:center;cursor:pointer;padding:8px}
.seticon img{width:32px;height:32px;object-fit:contain}
.seticon.on{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold) inset}
.setprev{display:flex;align-items:center;gap:10px;background:#dfe3ea;color:#222;border-radius:10px 10px 0 0;padding:8px 12px;max-width:260px;font:13px system-ui,sans-serif}
.setprev img{width:16px;height:16px}
.setprev span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
/* ban page: a banned account can sign in, but sees only this */
.banpage{position:fixed;inset:0;z-index:9000;background:radial-gradient(ellipse at top,#2a1220,#0b0d16 70%);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.banpage .bcard{width:100%;max-width:520px;background:#141827;border:1px solid #3a2232;border-radius:18px;padding:26px 24px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.banpage h1{margin:0 0 4px;font-size:30px;color:var(--bad);display:flex;gap:10px;align-items:center}
.banpage .brow{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;margin:18px 0;font-size:15px}
.banpage .brow b{color:var(--mute);font-weight:600}
.banpage .brow span{color:var(--text);overflow-wrap:anywhere}
.banpage .bleft{font-variant-numeric:tabular-nums;color:var(--gold)!important;font-weight:700}
.banpage textarea{width:100%;min-height:110px;resize:vertical;background:#0d1020;color:var(--text);border:1px solid #2a3150;border-radius:10px;padding:10px;font:inherit}
.banpage .bstat{margin-top:14px;padding:12px;border-radius:10px;background:#0f1324;border:1px solid #273052;font-size:14px;line-height:1.45}
.banpage .bapp{width:100%;margin-top:6px;font-size:16px;padding:13px}
.banpage .bfoot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px;flex-wrap:wrap}

<script>
/* ---------- Game list: add a game by adding one entry ----------
   Embedded game:  {id:'x', name:'X', cat:'Arcade', desc:'...', src:'games/x/index.html'}
   Built-in game:  {id:'x', name:'X', cat:'Casino', desc:'...', builtin:'flip'}
   Not ready yet:  add soon:true                                              */
const GAMES=[
  {id:'lobby',name:'Game Lobby',cat:'Official',desc:'A festive floating island. Walk around and pick a mode.',long:'A festive floating island in the sky. Walk around as your player, grab gems and presents for coins, buy cosmetics, set up trades, and head through the doors to each game mode. Use the party ring to team up with friends.',how:['Move with WASD or the arrow keys, or click where you want to go.','Walk over gems and chests to earn coins.','Stand near a door or the party pad and press E.'],builtin:'lobby',hue:215,ico:'🧭'},
  {id:'tournament',name:'Tournament',cat:'Official',desc:'Eight players, one bracket. Win your gun duel in a huge coliseum to advance.',builtin:'tour',hue:30,ico:'🏆',long:'A knockout bracket of eight (empty spots are filled with bots). Each round two fighters meet in a huge sandy coliseum full of pillars and cover. Everyone starts with a pistol; guns, ammo, health and shields lie all over the map, so the first job is to loot. A shrinking storm forces the fight. Win your duel to move on, and watch the other matches while you wait.',how:['WASD to move, mouse to aim, hold the mouse button to shoot.','R reloads. E picks up a gun or opens a chest. 1-3 or the mouse wheel switch guns.','Ammo, health and shields are picked up by walking over them.','Pillars and walls stop bullets. Use them for cover.','When it is not your match you spectate. Click or press Tab to switch fighter.']},
  {id:'ctf',name:'Capture the Flag',cat:'Official',desc:'Red vs Blue on a floating island. Steal their flag, defend yours.',builtin:'ctf',hue:210,ico:'🚩',long:'Two teams on a floating island, each with a base and a flag. Grab the enemy flag and carry it back to your own base while your flag is safe at home. First team to three captures wins. You respawn after a few seconds with a pistol, and guns, ammo and health are scattered around the island.',how:['WASD to move, mouse to aim, hold the mouse button to shoot.','Walk onto the enemy flag to pick it up. Touch your own dropped flag to return it.','Carry the flag to your base to score. Teammates can protect you.','R reloads. E picks up a gun. 1-3 or the mouse wheel switch guns.']},
  {id:'royale',name:'Battle Royale',cat:'Official',desc:'Drop from the bus, loot chests, outlast everyone.',builtin:'br',hue:280,ico:'🪂',long:'Twenty fighters ride a bus over a massive island. Jump out wherever you like, land, open chests for guns and ammo, and stay inside the shrinking storm. The last one standing wins.',how:['Press SPACE or click to jump from the bus, then glide toward your mouse pointer.','Run to a town and press E at a chest to open it, and E to take a gun.','The purple storm hurts and keeps closing. Stay inside the white circle.','WASD to move, mouse to aim and shoot, R to reload, 1-4 to switch guns.']},
  {id:'survival',name:'Wave Survival',cat:'Official',desc:'Team up and hold out against waves of zombies. Spend points on better guns and turrets.',builtin:'surv',hue:120,ico:'🧟',long:'Up to four survivors face fifteen waves of zombies: walkers, fast runners, heavy tanks, acid spitters and a boss every fifth wave. Kill zombies for points. Between waves the shop opens: refill ammo, heal, buy better guns and build turrets. If you fall, you come back at the start of the next wave. If the whole team falls at once, it is over.',how:['WASD to move, mouse to aim and shoot, R to reload.','Kill zombies to earn points. Between waves press Z (ammo), X (heal), C (next gun), V (turret).','Dead players return when the next wave begins.','Survive all 15 waves to win.']},
  {id:'gungame',name:'Gun Game',cat:'Official',desc:'Every kill gives you a better gun. First to finish the ladder wins.',builtin:'gun',hue:20,ico:'🔫',long:'Everyone respawns instantly and starts with a pistol. Each kill upgrades you to the next gun on an eight-step ladder, ending with the Golden Gun. The first player to get a kill with the Golden Gun wins; when time runs out the leader wins. Ammo is unlimited.',how:['WASD to move, mouse to aim and shoot.','Every kill moves you up a gun.','Health and shields lie around the map.','First to the Golden Gun kill wins.']},
  {id:'world',name:'Survival World',cat:'Official',desc:'Mine, build, farm, sail, and travel through portals to the Nether and the End. Survival, creative or hardcore.',builtin:'world',hue:140,ico:'🌍',long:'A big open world with three dimensions. Chop trees, mine ores, craft tools and armor, farm, fish, trade with villagers and build a base. Hearts and hunger keep you honest, and at night zombies, skeletons, spiders, creepers and endermen come out, so sleep in a bed! Explore villages, dungeons, shipwrecks and ruined portals, sail boats, light a Nether portal, hunt for the stronghold and defeat the Ender Dragon. Play Survival or Creative on Easy, Normal, Hard or one-life Hardcore, alone, with friends, or on a server.'},
  {id:'hideseek',name:'Hide and Seek',cat:'Official',desc:'Hiders disguise as props. Seekers shoot suspicious crates.',builtin:'hide',hue:300,ico:'📦',long:'Hiders turn into crates, barrels, bushes, rocks, bins and hay bales and hide among a hundred fake props. Seekers are released after a short countdown and have a pistol with limited ammo. Shoot a hider and they are revealed and become a seeker. Hiders win if time runs out.',how:['Hiders: press Q to change disguise, then stand still among the props. Moving makes you wobble.','Seekers: shoot props that look wrong. Ammo is limited, so pick up more.','Found hiders become seekers.','Hiders win if any are left when time runs out.']},
  {id:'parkour',name:'Parkour',cat:'Official',desc:'Race a side-view course that gets harder every round. Last one to finish is out. Or go Hardcore: outrun a wall of fire.',builtin:'parkour',hue:200,ico:'🧗',long:'Eight runners race the same randomly generated side-view course. Every round adds harder jumps and new blocks: ice, lava, bounce pads, crumbling stones, moving ferries, blinking platforms and conveyor belts. You can fall as many times as you like and respawn at your last checkpoint, but the last runner to reach the finish each round is eliminated. The last runner standing wins. Bots have blue names.',how:['A / D or the arrow keys to run, W, the up arrow or Space to jump. On a phone use the joystick and the jump button.','Touch a checkpoint flag to respawn there. You can respawn as often as you need.','Finish before the last runner. The slowest runner is eliminated every round.','Eliminated? Spectate and press Q / E to switch who you follow.']},
  {id:'casino',name:'Casino',cat:'Official',desc:'Blackjack, poker, roulette and slots. Play coins only.',builtin:'casino',hue:45,ico:'🎰',long:'The casino is a floor you walk around, with Blackjack, Texas Hold\'em against three bots, Roulette and Slots. Everything uses play coins that have no cash value and can never be bought or cashed out.',how:['Walk up to a table or machine and press E (or tap USE).','Blackjack: hit, stand or double. Blackjack pays 3 to 2.','Hold\'em: you sit down with 200 coins against three bots. Cash out any time to bring your chips back.','Roulette and Slots: tap chips, then spin.']},
];

/* ---------- Safe storage ---------- */
/* When you are signed in, your coins, XP, items and reward progress live only on the server: these keys are then kept in memory
   for this page and never written to the browser, so the guest wallet in localStorage stays the guest's. */
const WALLET_KEYS=new Set(['coins','xp','owned','eq','crates','streak','lvclaim','wadv']),WMEM={acct:false,m:{}};
const store={
  get(k,d){if(WMEM.acct&&WALLET_KEYS.has(k))return k in WMEM.m?JSON.parse(WMEM.m[k]):d;try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){if(WMEM.acct&&WALLET_KEYS.has(k)){WMEM.m[k]=JSON.stringify(v);return}try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let coins=store.get('coins',100);
const ACCHOOK={dirty(){}};let signedIn=false,signedOwner=false,signedStaff='';
let user=store.get('user','Guest'+Math.floor(1000+Math.random()*9000));
const $=s=>document.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!==undefined)e.innerHTML=h;return e};

const QUIPS=['Pull the sword. Collect the coins.','Fresh coins, no cap.','Your next high score is waiting.','Play a little. Earn a lot.','The blade chooses its player.'];
let xp=store.get('xp',0);
const lvOf=x=>Math.floor(Math.sqrt(x/40))+1;
function drawLv(){const L=lvOf(xp),a=40*(L-1)**2,b=40*L**2;$('#lvl').textContent='Level '+L;$('#xpb').style.width=((xp-a)/(b-a)*100)+'%'}
let shown=coins;
function setCoins(n,fromServer){
  INTEG.guard('setCoins');if(fromServer&&ECON.srv)ECON.srv.coins=Math.max(0,Math.floor(n));
  const old=coins;coins=Math.max(0,Math.floor(n));store.set('coins',coins);dailyState();ACCHOOK.dirty();
  cancelAnimationFrame(setCoins.r);const from=shown,t0=performance.now(),b=$('#bal');
  const step=t=>{const k=Math.min(1,(t-t0)/450);shown=Math.round(from+(coins-from)*k);b.textContent=shown.toLocaleString();if(k<1)setCoins.r=requestAnimationFrame(step)};
  step(t0);
  if(coins>old){try{REW.bump('coins',coins-old)}catch(e){}const l0=lvOf(xp);if(!fromServer){xp+=coins-old;store.set('xp',xp)}drawLv();if(lvOf(xp)>l0)toast('Level up! You are now level '+lvOf(xp));const c=document.querySelector('.coins i');c.classList.remove('spin');void c.offsetWidth;c.classList.add('spin')}
}
/* ---------- Economy ----------
   Guest: coins live in this browser. Signed in: every coin you get or spend is asked for on the server, which decides
   (prices, crates, the casino, how much a game can pay and how often). The page only shows what the server says. */
const ECON={
  get acct(){return WMEM.acct},
  rew:{crates:0,lv:0,quests:0,daily:true,sn:0,advs:[]},
  srv:null,
  apply(r){if(!r)return;if(ECON.acct){const S=ECON.srv||(ECON.srv={});if(r.coins!=null)S.coins=r.coins;if(r.xp!=null)S.xp=+r.xp||0;if(r.owned)S.owned=r.owned.slice()}if(r.rew)ECON.rew=r.rew;if(r.owned&&Array.isArray(r.owned)){owned=r.owned.slice();store.set('owned',owned)}
    if(r.coins!=null&&r.coins!==coins){const up=r.coins>coins;setCoins(r.coins,true);if(!up)REW.badge()}
    if(r.xp!=null){const l0=lvOf(xp);xp=+r.xp||0;store.set('xp',xp);drawLv();if(lvOf(xp)>l0)toast('Level up! You are now level '+lvOf(xp))}
    try{dailyState();REW.badge()}catch(e){}},
  /* later=true: hand back the answer without showing the new balance yet (so a spin is not spoiled) and call r.show() when it lands */
  ask(m,later){INTEG.guard('ECON.ask');return ACC.req(m).then(r=>{r=r||{ok:false,err:'No answer'};if(r.ok){if(later)r.show=()=>ECON.apply(r);else ECON.apply(r)}else r.show=()=>{};return r})},
  /* add coins for something you did. Resolves with the coins actually added. */
  earn(why,n,ref){n=Math.floor(n);if(!(n>0))return Promise.resolve(0);
    if(!ECON.acct){setCoins(coins+n);return Promise.resolve(n)}
    if(!NET.online()){toast('You are offline, so these coins could not be added to your account.');return Promise.resolve(0)}
    return ECON.ask({t:'econ.earn',why,n,ref}).then(r=>{if(!r.ok){if(r.err&&!/Too soon|Nothing/.test(r.err))toast(r.err);return 0}return r.n})},
  /* take coins (a bet, a buy-in). Resolves true when they were taken. */
  spend(n){n=Math.floor(n);if(coins<n){toast('Not enough coins');return Promise.resolve(false)}
    if(!ECON.acct){setCoins(coins-n);return Promise.resolve(true)}
    return ECON.ask({t:'econ.spend',n}).then(r=>{if(!r.ok)toast(r.err||'Could not take the coins.');return !!r.ok})},
  /* the server's answer may arrive before or after the animation; this keeps the display honest */
  enter(u){WMEM.acct=true;WMEM.m={};ECON.srv={coins:+u.coins||0,xp:+u.xp||0,owned:Array.isArray(u.owned)&&u.owned.length?u.owned.slice():null};ECON.apply({rew:u.rew});const pa={};for(const id of (u.rew&&u.rew.advs)||[])pa[id]=1;store.set('wadv',pa)},
  leave(){WMEM.acct=false;WMEM.m={};ECON.srv=null;ECON.rew={crates:0,lv:0,quests:0,daily:true,sn:0,advs:[]};
    coins=store.get('coins',100);shown=coins;$('#bal').textContent=coins.toLocaleString();xp=store.get('xp',0);drawLv();
    owned=store.get('owned',DEFAULT_COS.slice());eq={...eq,...store.get('eq',{})};try{dailyState();REW.badge()}catch(e){}}
};
function float(txt,x,y,color){const e=el('div','float',txt);e.style.left=x+'px';e.style.top=y+'px';if(color)e.style.color=color;document.body.append(e);setTimeout(()=>e.remove(),900)}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),1800)}
function dailyState(){const b=$('#daily');let ready=true,n=0;try{ready=REW.canDaily();n=REW.streakNow()}catch(e){}b.classList.toggle('ready',ready);b.textContent=ready?'🎁 Daily reward':'🔥 '+n+' day'+(n===1?'':'s')}
$('#daily').onclick=()=>{try{if(REW.canDaily()){REW.claimDaily();return}}catch(e){}go('rewards')};
function setUser(){const na=$('#navadmin');if(na)na.hidden=!signedOwner;const un=$('#uname');un.classList.toggle('rb',!!signedStaff);un.textContent=(signedStaff==='owner'?'👑 ':signedStaff==='admin'?'⭐ ':'')+(signedIn?'✓ ':'')+user;$('#ucap').textContent=signedIn?'Signed in to your account':'Guest. Click your name to change it'}
$('#uname').onclick=()=>{if(signedIn){toast('Your name comes from your account');return}const n=(prompt('Pick a username (max 16 characters)',user)||'').trim().slice(0,16);if(n){user=n;store.set('user',n);setUser()}};

/* ---------- Music and sound effects (all synthesized in the browser, no files) ---------- */
const AUD=(()=>{
  let ctx=null,out,sfx,nb=null;
  const P=Object.assign({on:true,s:.8},store.get('audio',{}));
  const gains=()=>{if(!ctx)return;out.gain.value=P.on?1:0;sfx.gain.value=P.s*.8};
  const inGame=()=>typeof WM!=='undefined'&&WM.wins.some(w=>w.id===WM.active&&!w.el.classList.contains('min'));
  function init(){
    if(ctx){if(ctx.state==='suspended')ctx.resume();return}
    try{ctx=new(window.AudioContext||window.webkitAudioContext)();out=ctx.createGain();sfx=ctx.createGain();sfx.connect(out);out.connect(ctx.destination);gains();
      const n=ctx.sampleRate*1.5|0;nb=ctx.createBuffer(1,n,ctx.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1}catch(e){ctx=null}
  }
  function tone(f,t,d,type,v,dst,to){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(dst);o.start(t);o.stop(t+d+.03)}
  function noise(t,d,v,dst,f0,f1){const s=ctx.createBufferSource(),g=ctx.createGain(),fl=ctx.createBiquadFilter();s.buffer=nb;fl.type='bandpass';fl.frequency.setValueAtTime(f0,t);if(f1)fl.frequency.exponentialRampToValueAtTime(f1,t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl);fl.connect(g);g.connect(dst);s.start(t);s.stop(t+d)}
  const S={
    click:t=>tone(700,t,.06,'square',.12,sfx),
    coin:t=>{tone(988,t,.08,'square',.14,sfx);tone(1319,t+.07,.18,'square',.14,sfx)},
    gem:t=>{tone(1200,t,.1,'triangle',.2,sfx);tone(1800,t+.06,.2,'triangle',.18,sfx)},
    jump:t=>tone(300,t,.16,'square',.1,sfx,720),
    land:t=>noise(t,.07,.18,sfx,300,120),
    hit:t=>{noise(t,.09,.35,sfx,900,300);tone(160,t,.1,'sawtooth',.18,sfx,70)},
    place:t=>{tone(220,t,.07,'square',.16,sfx,140);noise(t,.05,.12,sfx,500)},
    brk:t=>{noise(t,.18,.35,sfx,1200,200);tone(120,t,.12,'sawtooth',.14,sfx,50)},
    throw:t=>noise(t,.22,.2,sfx,400,1800),
    boom:t=>{noise(t,.6,.7,sfx,500,60);tone(90,t,.5,'sawtooth',.35,sfx,30)},
    bed:t=>{tone(180,t,.6,'sawtooth',.3,sfx,60);noise(t,.5,.4,sfx,700,90)},
    kill:t=>{tone(520,t,.12,'square',.18,sfx,260);tone(260,t+.1,.2,'square',.18,sfx,130)},
    die:t=>tone(380,t,.35,'sawtooth',.18,sfx,70),
    respawn:t=>{tone(440,t,.1,'triangle',.2,sfx);tone(660,t+.08,.14,'triangle',.2,sfx)},
    win:t=>[523,659,784,1047].forEach((f,i)=>tone(f,t+i*.11,.3,'triangle',.25,sfx)),
    lose:t=>[392,349,311,262].forEach((f,i)=>tone(f,t+i*.16,.36,'sawtooth',.15,sfx)),
    card:t=>noise(t,.07,.25,sfx,2500,800),
    chip:t=>{tone(1500,t,.05,'square',.09,sfx);tone(1100,t+.04,.07,'square',.09,sfx)},
    spin:t=>tone(300+Math.random()*400,t,.05,'square',.07,sfx),
    move:t=>{tone(300,t,.05,'triangle',.25,sfx);noise(t,.04,.12,sfx,800)},
    cap:t=>{tone(200,t,.1,'square',.22,sfx,110);noise(t,.08,.25,sfx,1000)},
    check:t=>{tone(880,t,.1,'square',.18,sfx);tone(880,t+.14,.14,'square',.18,sfx)},
    bounce:t=>tone(250,t,.28,'sine',.3,sfx,900),
    crumble:t=>noise(t,.3,.3,sfx,300,90),
    lava:t=>{noise(t,.35,.35,sfx,600,100);tone(200,t,.3,'sawtooth',.14,sfx,60)},
    flag:t=>{tone(660,t,.1,'triangle',.2,sfx);tone(990,t+.09,.16,'triangle',.2,sfx)},
    tick:t=>tone(880,t,.07,'square',.13,sfx),
    go:t=>tone(1320,t,.3,'square',.18,sfx),
    err:t=>tone(150,t,.15,'square',.18,sfx),
    buy:t=>{tone(700,t,.06,'square',.14,sfx);tone(1050,t+.06,.1,'square',.14,sfx)},
    fin:t=>[660,880,1320].forEach((f,i)=>tone(f,t+i*.07,.2,'triangle',.22,sfx)),
    jackpot:t=>{for(let i=0;i<8;i++)tone(600+i*110,t+i*.06,.18,'square',.14,sfx)},
  };
  const play=n=>{if(!ctx||!P.on||!S[n]||!inGame())return;try{S[n](ctx.currentTime+.005)}catch(e){}};
  function ui(){
    const b=el('button','audbtn','🔊'),p=el('div','audpanel');p.hidden=true;b.title='Game sound effects';
    p.innerHTML='<label>Effects<input type="range" min="0" max="1" step=".05" data-k="s"></label><label class="chk"><input type="checkbox" data-k="on"> Sound effects (games only)</label>';
    const sync=()=>{p.querySelector('[data-k=s]').value=P.s;p.querySelector('[data-k=on]').checked=P.on;b.textContent=P.on&&P.s>0?'🔊':'🔇'};
    p.addEventListener('input',e=>{const k=e.target.dataset.k;if(!k)return;P[k]=k==='on'?e.target.checked:+e.target.value;gains();store.set('audio',P);sync()});
    b.onclick=()=>{init();p.hidden=!p.hidden};sync();
    $('header .coins').before(b);document.body.append(p);
  }
  ['pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev,init,{passive:true}));
  return{init,sfx:play,music:()=>{},ui};
})();

/* ---------- Touch controls: joystick and action buttons for phones and tablets ---------- */
function touchUI(wrap,cfg){
  if(!(matchMedia('(pointer:coarse)').matches||window.__touch))return()=>{};
  const ui=el('div','tui');wrap.append(ui);
  const down={},key=(k,d)=>{if(!!down[k]===d)return;down[k]=d;dispatchEvent(new KeyboardEvent(d?'keydown':'keyup',{key:k}))};
  if(cfg.stick){
    const st=el('div','tstick','<i></i>'),nub=st.firstChild;ui.append(st);let id=null;
    const upd=e=>{const r=st.getBoundingClientRect(),R=r.width/2;let dx=e.clientX-(r.left+R),dy=e.clientY-(r.top+R);const m=Math.hypot(dx,dy);if(m>R){dx*=R/m;dy*=R/m}

    const r=sw/sh,VW=r>=1?Math.round(540*r):540,VH=r>=1?540:Math.round(540/r);

}

function drawAvatar(c,x,y,o){if(AVSTYLE==='classic')return drawAvatarClassic(c,x,y,o);

function drawPattern(c,p,col,top,W,H,t){

  else if(p==='stars'||p==='galaxy'){if(p==='galaxy'){const g=c.createRadialGradient(4,top+H*.45,2,0,top+H/2,26);g.addColorStop(0,'rgba(255,120,220,.75)');g.addColorStop(.4,'rgba(120,90,255,.45)');g.addColorStop(1,'rgba(10,10,40,0)');c.fillStyle=g;c.fillRect(x0,top,W,H)}

  else if(p==='camo'){const cs=['#3e5528','#7a8f4a','#2c3a1c','#94a35e'];for(let i=0;i<9;i++){c.fillStyle=cs[i%4];c.beginPath();c.ellipse(x0+((i*11)%W),top+((i*13)%H),5+(i%3)*2,3+(i%2)*2,i,0,TAU);c.fill()}}

/* the classic character (the first design), kept as an option in Cosmetics */
function drawAvatarClassic(c,x,y,o){
  const TAU=6.283,s=o.s||1,d=o.dir||0,t=o.t||0,mv=!!o.moving,ph=mv?Math.sin(o.walk):0;
  const bob=mv?Math.abs(Math.cos(o.walk))*2.2:Math.sin(t*2.5)*.8;
  const col=o.rainbow?rainCol(t):(o.skin||'#4f8cff'),dk=shade(col,-.3),lt=shade(col,.4);
  c.save();c.translate(x,y);c.scale(s,s);
  c.fillStyle='rgba(30,40,80,.25)';c.beginPath();c.ellipse(0,0,14,4.5,0,0,TAU);c.fill();
  c.fillStyle=dk;
  if(d>1){rrp(c,-4+ph*5,-12,8,12,4);c.fill();rrp(c,-4-ph*5,-12,8,12,4);c.fill()}
  else{rrp(c,-10,-12-Math.max(0,ph)*3,8,12,4);c.fill();rrp(c,2,-12-Math.max(0,-ph)*3,8,12,4);c.fill()}
  const cy=-26-bob;
  const arm=(ax,ang)=>{c.save();c.translate(ax,cy-1);c.rotate(ang);rrp(c,-3.5,-2,7,15,3.5);c.fill();c.restore()};
  c.fillStyle=dk;
  if(d<=1){arm(-14,.5+ph*.5);arm(14,-.5-ph*.5)}
  const g=c.createRadialGradient(-6,cy-8,2,0,cy,22);g.addColorStop(0,lt);g.addColorStop(1,col);
  c.fillStyle=g;c.beginPath();c.ellipse(0,cy,15,17,0,0,TAU);c.fill();c.strokeStyle=dk;c.lineWidth=1.5;c.stroke();
  if(o.pat&&PATS.has(o.pat)){c.save();c.beginPath();c.ellipse(0,cy,15,17,0,0,TAU);c.clip();drawPattern(c,o.pat,col,cy-17,30,34,t);c.restore()}
  if(d>1){c.fillStyle=dk;arm(d===2?3:-3,(d===2?-1:1)*ph*.9)}
  if(d!==1){
    const fx=d===2?-5:d===3?5:0,sp=d>1?3.8:5.5;
    for(const k of[-1,1]){const ex=fx+k*sp;
      c.fillStyle='#fff';c.beginPath();c.ellipse(ex,cy-4,3.6,4.6,0,0,TAU);c.fill();
      c.fillStyle='#16182a';c.beginPath();c.arc(ex+fx*.15,cy-3.4,2.1,0,TAU);c.fill();
      c.fillStyle='#fff';c.beginPath();c.arc(ex+fx*.15+.8,cy-4.5,.7,0,TAU);c.fill()}
    c.fillStyle='rgba(255,110,140,.45)';
    if(d!==3){c.beginPath();c.arc(fx-9,cy+3,2.6,0,TAU);c.fill()}
    if(d!==2){c.beginPath();c.arc(fx+9,cy+3,2.6,0,TAU);c.fill()}
    c.strokeStyle='#16182a';c.lineWidth=1.4;c.beginPath();c.arc(fx,cy+2.5,3,.25,Math.PI-.25);c.stroke();
  }
  drawHat(c,o.hat,cy-13,o);
  c.restore();
}

/* trails: every game keeps one of these and feeds it the players it draws, so everybody's trail shows everywhere */
const TRAILDEF={t_spark:['✦','#ffd84a'],t_dots:['●','#7fd6ff'],t_bubbles:['○','#bfe8ff'],t_leaves:['🍃','#8ad34a'],t_snow:['❄','#e6f4ff'],t_hearts:['♥','#ff6fa8'],
  t_notes:['♪','#c9a3ff'],t_stars:['★','#ffe28a'],t_smoke:['smoke','#9aa3b5'],t_bolt:['ϟ','#9fdcff'],t_fire:['fire','#ff8a3d'],t_coins:['coin','#f2b84b'],t_skull:['☠','#e8eef8'],t_rainbow:['✦','#fff']};
function mkTrails(){
  const P=[],last=new Map();
  return{
    feed(key,x,y,id,moving,t){const d=TRAILDEF[id];if(!d)return;const L=last.get(key)||{x,y,a:0};const dist=Math.hypot(x-L.x,y-L.y);L.a+=dist;L.x=x;L.y=y;last.set(key,L);
      if(!moving&&dist<.5)return;if(L.a<9)return;L.a=0;if(P.length>420)P.splice(0,40);
      const col=id==='t_rainbow'?RAINBOW[(Math.random()*8)|0]:d[1];
      P.push({x:x+(Math.random()-.5)*12,y:y-4-Math.random()*8,vx:(Math.random()-.5)*18,vy:d[0]==='smoke'||d[0]==='fire'?-30-Math.random()*20:-12-Math.random()*16,l:1,k:d[0],c:col,r:d[0]==='smoke'?5+Math.random()*4:10+Math.random()*5,sp:Math.random()*6})},
    step(dt){for(const p of P){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt*(p.k==='smoke'?.9:1.25);if(p.k==='smoke')p.r+=dt*9}for(let i=P.length-1;i>=0;i--)if(P[i].l<=0)P.splice(i,1)},
    draw(c){c.save();c.textAlign='center';c.textBaseline='middle';
      for(const p of P){const a=Math.max(0,Math.min(1,p.l));c.globalAlpha=a;
        if(p.k==='smoke'){c.fillStyle='rgba(150,158,175,'+(.35*a)+')';c.beginPath();c.arc(p.x,p.y,p.r,0,6.283);c.fill();continue}
        if(p.k==='fire'){const g=c.createRadialGradient(p.x,p.y,0,p.x,p.y,7*a+2);g.addColorStop(0,'#fff3b0');g.addColorStop(.5,'#ff9a3d');g.addColorStop(1,'rgba(255,60,30,0)');c.fillStyle=g;c.beginPath();c.arc(p.x,p.y,7*a+2,0,6.283);c.fill();continue}
        if(p.k==='coin'){c.fillStyle='#f2b84b';c.beginPath();c.ellipse(p.x,p.y,4*Math.abs(Math.cos(p.sp+p.l*8))+.8,4.2,0,0,6.283);c.fill();c.strokeStyle='#b07a14';c.lineWidth=1;c.stroke();continue}
        c.fillStyle=p.c;c.font='700 '+Math.round(p.r)+'px sans-serif';c.fillText(p.k,p.x,p.y)}
      c.globalAlpha=1;c.restore()}
  };
}

  if(groups[0][1]===3&&groups[1]&&groups[1][1]>=2)return[6,groups[0][0],groups[1][0]];
  if(suited)return[5,...suited.slice(0,5)];

  const kick=ex=>cs.map(c=>c.r).filter(r=>!ex.includes(r)).sort((a,b)=>b-a);
  if(groups[0][1]===3)return[3,groups[0][0],...kick([groups[0][0]]).slice(0,2)];

   Either way the game only talks to NET, and the messages are the same:
     join {room,p,meta}  joincode {code,req,p}  who {}  state {room,s}  chat {room,text}  leave {room}

/* ---------- Kill effects ---------- */
/* killFx(id,x,y) adds an effect to the shared list FX (hub), mkKillFx() gives a game its own list in world coordinates */
function kfxSpawn(L,id,sx,sy){
  const k=id||'k_none';if(k==='k_none')return;
  const TAU2=6.283,n=k==='k_confetti'?40:k==='k_coins'?22:k==='k_void'?0:k==='k_ghost'?6:28;
  for(let i=0;i<n;i++){const a=Math.random()*TAU2,d=40+Math.random()*100;
    L.push({x:sx,y:sy,vx:Math.cos(a)*d,vy:Math.sin(a)*d-(k==='k_coins'?120:40),l:1,g:k==='k_ghost'?-60:260,s:14+Math.random()*26,rot:Math.random()*6,vr:(Math.random()-.5)*12,
      c:k==='k_rainbow'?RAINBOW[i%RAINBOW.length]:k==='k_fire'?['#ffd27a','#ff8a3d','#ff5a5a','#fff2b0'][i%4]:k==='k_stars'?'#ffe28a':k==='k_confetti'?RAINBOW[i%RAINBOW.length]:k==='k_ghost'?'#e8eef8':k==='k_coins'?'#f2b84b':'#ffd27a',
      r:k==='k_confetti'?4.5:k==='k_stars'?null:k==='k_coins'?'coin':k==='k_ghost'?'ghost':3})}
  if(k==='k_lightning'||k==='k_pop'||k==='k_fire'){
    L.push({bolt:true,x:sx,y:sy,l:1,c:k==='k_fire'?'#ffd27a':'#bfe6ff',
      segs:Array.from({length:7},(_,i)=>({x:(Math.random()-.5)*90,y:-60-i*16}))})}
  if(k==='k_rainbow'||k==='k_pop')L.push({ring:true,x:sx,y:sy,l:1,s:30,c:'#fff',rain:k==='k_rainbow'});
  if(k==='k_void')L.push({hole:true,x:sx,y:sy,l:1.4});
  if(k==='k_ghost')L.push({spirit:true,x:sx,y:sy,l:1.6});
}
function kfxTick(L,dt){
  for(let i=L.length-1;i>=0;i--){const p=L[i];
    if(p.bolt){p.l-=dt*1.4;if(p.l<=0)L.splice(i,1);continue}
    if(p.ring){p.s+=380*dt;p.l-=dt*1.1;if(p.l<=0)L.splice(i,1);continue}
    if(p.hole||p.spirit){p.l-=dt;if(p.l<=0)L.splice(i,1);continue}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.g||260)*dt;p.rot+=(p.vr||0)*dt;p.l-=dt*.9;if(p.l<=0)L.splice(i,1)}
}
function kfxDraw(L,c,cam){
  const ox=cam?cam.x:0,oy=cam?cam.y:0;
  for(const p of L){
    c.globalAlpha=Math.max(0,Math.min(1,p.l));const X=p.x-ox,Y=p.y-oy;
    if(p.bolt){c.strokeStyle=p.c;c.lineWidth=2.5;c.shadowColor=p.c;c.shadowBlur=8;c.beginPath();c.moveTo(X,Y);
      for(const s of p.segs)c.lineTo(X+s.x*p.l+Math.random()*6-3,Y+s.y*(1-p.l*.6));c.stroke();c.shadowBlur=0;continue}
    if(p.ring){c.strokeStyle=p.rain?RAINBOW[(p.s|0)%RAINBOW.length]:p.c;c.lineWidth=4;c.beginPath();c.arc(X,Y,p.s/2,0,6.283);c.stroke();continue}
    if(p.hole){const k=Math.min(1,p.l),r=6+40*Math.sin(Math.min(1,(1.4-p.l)/1.4)*Math.PI);c.globalAlpha=1;const g=c.createRadialGradient(X,Y,0,X,Y,r+14);g.addColorStop(0,'#000');g.addColorStop(.6,'rgba(40,0,70,.9)');g.addColorStop(1,'rgba(150,80,255,0)');c.fillStyle=g;c.beginPath();c.arc(X,Y,r+14,0,6.283);c.fill();
      c.strokeStyle='rgba(190,140,255,'+k+')';c.lineWidth=2;c.beginPath();c.arc(X,Y,r+4,p.l*6,p.l*6+4);c.stroke();continue}
    if(p.spirit){const k=1.6-p.l;c.globalAlpha=Math.min(1,p.l);c.fillStyle='rgba(235,242,255,.92)';c.beginPath();c.arc(X,Y-20-k*60,11,Math.PI,0);c.lineTo(X+11,Y-8-k*60);for(let i=0;i<4;i++)c.lineTo(X+11-5.5*(i+.5),Y-(i%2?8:3)-k*60);c.closePath();c.fill();
      c.fillStyle='#1b1e2b';c.beginPath();c.arc(X-4,Y-21-k*60,1.8,0,6.283);c.arc(X+4,Y-21-k*60,1.8,0,6.283);c.fill();continue}
    c.fillStyle=p.c;
    if(p.r===null){c.save();c.translate(X,Y);c.rotate(p.rot);c.beginPath();
      for(let i=0;i<10;i++){const a=i/10*6.283-Math.PI/2,r=i%2?p.s*.35:p.s*.8;c.lineTo(Math.cos(a)*r,Math.sin(a)*r)}c.fill();c.restore()}
    else if(p.r==='coin'){c.beginPath();c.ellipse(X,Y,5*Math.abs(Math.cos(p.rot))+1,5,0,0,6.283);c.fill();c.strokeStyle='#a86f10';c.lineWidth=1;c.stroke()}
    else if(p.r==='ghost'){c.beginPath();c.arc(X,Y,3,0,6.283);c.fill()}
    else{c.save();c.translate(X,Y);c.rotate(p.rot);c.fillRect(-p.r,-p.r*.6,p.r*2,p.r*1.2);c.restore()}}
  c.globalAlpha=1;
}
let FX=[];
function killFx(id,sx,sy){kfxSpawn(FX,id,sx,sy)}
function fxTick(dt){kfxTick(FX,dt)}
function fxDraw(c,cam){kfxDraw(FX,c,cam)}

   Everyone stands on a white floating island with pillars; the owner sits on a throne on a little floating balcony above

   It keeps going until one player is left. The owner's browser runs the event (it is always the room's master). */

  d.querySelector('.anbar i').style.animationDuration='5s';document.body.append(d);AUD.sfx('win');

/* ---------- Sparks ---------- */
function burst(x,y,color){
  for(let i=0;i<10;i++){
    const s=el('div','spark'),a=Math.random()*6.283,d=30+Math.random()*40;
    s.style.cssText=`left:${x}px;top:${y}px;background:${color||'#f2b84b'};--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px`;

  }

/* ---------- Gliding constellation background ---------- */
(function(){
  const cv=$('#stars'),cx=cv.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  let W,H,dpr,pts=[],mouse={x:-999,y:-999},shoot=null,next=2000;
  function size(){
    dpr=Math.min(devicePixelRatio||1,2);W=cv.width=innerWidth*dpr;H=cv.height=innerHeight*dpr;
    const n=Math.min(120,Math.round(innerWidth*innerHeight/14000));
    pts=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.3*dpr,vy:(Math.random()-.5)*.3*dpr,r:(Math.random()*1.4+.7)*dpr}));
  }
  addEventListener('resize',size);
  addEventListener('pointermove',e=>{mouse.x=e.clientX*dpr;mouse.y=e.clientY*dpr});
  let idle=false;const BK=8,buckets=Array.from({length:BK},()=>[]);
  function frame(t){
    /* a game covers the whole page: nothing here is visible, so draw nothing */
    if(document.body.classList.contains('in-game')||document.hidden){if(!idle){cx.clearRect(0,0,W,H);idle=true}if(!reduce)requestAnimationFrame(frame);return}idle=false;
    cx.clearRect(0,0,W,H);
    const L=130*dpr,M=170*dpr;
    for(const p of pts){
      if(!reduce){p.x+=p.vx;p.y+=p.vy}
      if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0;
    }
    cx.lineWidth=dpr;
    /* lines are grouped by brightness and drawn in 8 strokes instead of one stroke each */
    for(const b of buckets)b.length=0;const L2=L*L;
    for(let i=0;i<pts.length;i++){const a=pts[i];
      for(let j=i+1;j<pts.length;j++){const b=pts[j],dx=a.x-b.x,dy=a.y-b.y,d2=dx*dx+dy*dy;if(d2<L2){const q=Math.min(BK-1,Math.floor((1-Math.sqrt(d2)/L)*BK));buckets[q].push(a.x,a.y,b.x,b.y)}}}
    for(let q=0;q<BK;q++){const B=buckets[q];if(!B.length)continue;cx.strokeStyle='rgba(140,180,255,'+(((q+.5)/BK)*.4).toFixed(3)+')';cx.beginPath();for(let i=0;i<B.length;i+=4){cx.moveTo(B[i],B[i+1]);cx.lineTo(B[i+2],B[i+3])}cx.stroke()}
    for(let i=0;i<pts.length;i++){
      const a=pts[i];
      const dm=Math.hypot(a.x-mouse.x,a.y-mouse.y);
      if(dm<M){cx.strokeStyle=`rgba(242,184,75,${(1-dm/M)*.6})`;cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(mouse.x,mouse.y);cx.stroke()}
      cx.fillStyle='rgba(205,225,255,.9)';cx.beginPath();cx.arc(a.x,a.y,a.r,0,6.283);cx.fill();
    }
    if(!reduce){
      if(!shoot&&t>next){shoot={x:Math.random()*W*.6,y:Math.random()*H*.4,vx:10*dpr,vy:4*dpr,life:1};next=t+4000+Math.random()*5000}
      if(shoot){
        const s=shoot;s.x+=s.vx;s.y+=s.vy;s.life-=.02;
        cx.strokeStyle=`rgba(255,236,190,${Math.max(s.life,0)})`;cx.lineWidth=2*dpr;
        cx.beginPath();cx.moveTo(s.x,s.y);cx.lineTo(s.x-s.vx*7,s.y-s.vy*7);cx.stroke();
        if(s.life<=0)shoot=null;
      }
      requestAnimationFrame(frame);
    }
  }
  size();requestAnimationFrame(frame);
})();
