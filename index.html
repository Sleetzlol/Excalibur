<style>
:root{
  --bg:#02040c; --panel:rgba(9,18,52,.68); --panel2:rgba(22,38,92,.78); --line:rgba(120,160,255,.24);
  --text:#e8ecf6; --mute:#8d98b5; --gold:#f2b84b; --steel:#7fa8ff; --bad:#ff7a7a; --good:#6fdc9a;
  --head:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:linear-gradient(160deg,#02040c 0%,#06103a 50%,#0b2270 100%) fixed;color:var(--text);font:400 15px/1.5 var(--body);
  padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0}
:focus-visible{outline:2px solid var(--steel);outline-offset:2px}
.app{display:grid;grid-template-columns:220px 1fr;height:100%}
nav{background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:6px}
.logo{font:800 22px var(--head);letter-spacing:.3px;padding:0 10px 18px}
.logo b{color:var(--gold);font-weight:800}
nav button{background:none;text-align:left;padding:10px 12px;border-radius:10px;color:var(--mute);font-weight:500}
nav button:hover{background:var(--panel2);color:var(--text)}
nav button.on{background:var(--panel2);color:var(--text);box-shadow:inset 3px 0 0 var(--gold)}
.me{margin-top:auto;padding:12px;border:1px solid var(--line);border-radius:12px;font-size:13px;color:var(--mute)}
.me strong{display:block;color:var(--text);font-size:15px;cursor:pointer}
main{display:flex;flex-direction:column;min-width:0;height:100%}
header{display:flex;gap:12px;align-items:center;padding:16px 24px;border-bottom:1px solid var(--line)}
header input{flex:1;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.coins{margin-left:auto;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 8px 6px 14px;font-weight:700}
.coins i{width:14px;height:14px;border-radius:50%;background:var(--gold);box-shadow:inset -2px -2px 0 #c48a1e}
.coins button{background:var(--gold);color:#201500;border-radius:999px;padding:4px 12px;font-weight:700;font-size:13px}
.coins button:disabled{background:var(--line);color:var(--mute);cursor:default}
.view{flex:1;overflow:auto;padding:24px}
h1{font:800 28px var(--head);margin-bottom:4px}
.sub{color:var(--mute);margin-bottom:18px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}
.chip{background:var(--panel);border:1px solid var(--line);color:var(--mute);padding:6px 14px;border-radius:999px}
.chip.on{background:var(--steel);border-color:var(--steel);color:#08142e;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:left;padding:0;display:flex;flex-direction:column}
.card:hover{border-color:var(--steel)}
.card .art{height:100px;display:grid;place-items:center;font:800 34px var(--head);color:rgba(255,255,255,.9)}
.card .txt{padding:12px 14px}
.card strong{display:block}
.card span{color:var(--mute);font-size:13px}
.tag{display:inline-block;margin-top:6px;font-size:12px;color:var(--gold)}
.card.soon{opacity:.55;cursor:default}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;max-width:560px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}
.btn{background:var(--steel);color:#08142e;font-weight:700;padding:10px 18px;border-radius:10px}
.btn.alt{background:var(--panel2);color:var(--text);border:1px solid var(--line)}
.btn.gold{background:var(--gold);color:#201500}
.btn:disabled{opacity:.4;cursor:default}
.back{background:none;color:var(--mute);margin-bottom:14px;padding:0}
.back:hover{color:var(--text)}
.bar{height:6px;background:var(--panel2);border-radius:6px;overflow:hidden;max-width:560px;margin:0 0 18px}
.bar div{height:100%;width:0;background:var(--gold)}
.big{font:800 54px var(--head);margin:6px 0}
input.num{width:110px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.msgs{height:340px;overflow:auto;display:flex;flex-direction:column;gap:8px;margin:12px 0}
.msg b{color:var(--steel)}
.note{color:var(--mute);font-size:13px;margin-top:12px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0));transform:translateX(-50%);background:var(--panel2);border:1px solid var(--gold);padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (max-width:760px){
  .app{grid-template-columns:1fr;grid-template-rows:1fr auto}
  nav{order:2;flex-direction:row;border-right:0;border-top:1px solid var(--line);padding:8px;justify-content:space-around}
  .logo,.me{display:none}
  nav button{text-align:center;padding:10px 14px}
  nav button.on{box-shadow:inset 0 3px 0 var(--gold)}
  header{padding:12px 14px}.view{padding:16px}
}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
nav,header,.card,.panel{backdrop-filter:blur(10px)}
h1,.logo{background:linear-gradient(90deg,#fff,#9fc0ff,#f2b84b,#fff);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s linear infinite}
.logo b{color:var(--gold)}
@keyframes shine{to{background-position:-300% 0}}
#daily:not(:disabled){animation:ping 2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(242,184,75,.7)}70%,100%{box-shadow:0 0 0 12px rgba(242,184,75,0)}}
.coins{box-shadow:0 0 22px rgba(242,184,75,.16)}
.lv{margin-top:10px;font-size:12px;color:var(--gold);font-weight:700}
.xp{height:6px;background:rgba(255,255,255,.1);border-radius:6px;overflow:hidden;margin-top:4px}
.xp div{height:100%;width:0;background:linear-gradient(90deg,var(--steel),var(--gold));transition:width .5s}
.chip{transition:transform .15s,background .2s}
.chip:hover{transform:translateY(-2px)}
.card .art{background-size:200% 200%!important;animation:flow 7s ease infinite;transition:font-size .2s}
@keyframes flow{50%{background-position:100% 100%}}
.card:hover .art{font-size:50px}
.card:not(.soon):hover{border-color:hsl(var(--h,220) 85% 65%);box-shadow:0 14px 34px rgba(0,0,0,.5),0 0 28px hsl(var(--h,220) 85% 55%/.45)}
.hero::after{content:"";position:absolute;inset:0;pointer-events:none;transform:translateX(-120%);animation:gloss 6s ease-in-out infinite;
  background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.12) 50%,transparent 58%)}
@keyframes gloss{60%,100%{transform:translateX(120%)}}
.spark{position:fixed;z-index:20;width:6px;height:6px;border-radius:50%;pointer-events:none;animation:spark .65s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
.toast.show{animation:tin .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes tin{from{transform:translateX(-50%) translateY(24px) scale(.9)}}
.view{animation:viewin .35s ease}
@keyframes viewin{from{opacity:0;transform:translateY(8px)}}
nav button{transition:background .2s,color .2s,transform .15s}
nav button:hover{transform:translateX(3px)}
.btn{transition:transform .12s,filter .2s}
.btn:hover:not(:disabled){filter:brightness(1.12)}
.btn:active:not(:disabled){transform:scale(.94)}
.card{position:relative;transition:transform .22s,box-shadow .22s,border-color .22s;animation:pop .5s both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes pop{from{opacity:0;transform:translateY(16px) scale(.95)}}
.card:not(.soon):hover{transform:translateY(-6px);box-shadow:0 14px 32px rgba(0,0,0,.5)}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;transform:translateX(-120%);transition:transform .6s;
  background:linear-gradient(105deg,transparent 40%,rgba(255,255,255,.15) 50%,transparent 60%)}
.card:not(.soon):hover::after{transform:translateX(120%)}
.card .art{position:relative;overflow:hidden;text-shadow:0 4px 22px rgba(0,0,0,.45);font-size:40px}
.card .art::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(45deg,rgba(255,255,255,.06) 0 10px,transparent 10px 20px)}
.hero{position:relative;overflow:hidden;border-radius:18px;padding:30px 34px;margin-bottom:26px;border:1px solid var(--line);
  background:linear-gradient(120deg,#1b2a66,#34206a 60%,#58284f);display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.hero::before{content:"";position:absolute;width:320px;height:320px;right:-60px;top:-90px;border-radius:50%;
  background:radial-gradient(circle,rgba(242,184,75,.4),transparent 65%);animation:pulse 4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.25);opacity:.6}}
.hero h2{font:800 32px var(--head);line-height:1.1}
.hero p{color:#cfd6ee;max-width:420px;margin-top:8px}
.hero .tag{background:rgba(0,0,0,.3);padding:4px 12px;border-radius:999px;margin-top:14px}
@keyframes bob{50%{transform:translateY(-10px) rotate(4deg)}}
.coins i.spin{animation:spin .6s}
@keyframes spin{to{transform:rotateY(360deg)}}
.float{position:fixed;z-index:20;pointer-events:none;font:800 20px var(--head);color:var(--gold);animation:rise .9s ease-out forwards}
@keyframes rise{to{transform:translateY(-60px);opacity:0}}
.shake{animation:shake .16s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.coin3d{width:110px;height:110px;margin:16px 0;perspective:600px}
.coin3d div{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;font:800 20px var(--head);color:#201500;
  background:radial-gradient(circle at 30% 30%,#ffe29a,var(--gold) 55%,#b97d14);box-shadow:inset 0 0 0 6px rgba(0,0,0,.12),0 8px 26px rgba(242,184,75,.35)}
.coin3d.flip div{animation:flip 1s cubic-bezier(.3,.6,.3,1)}
@keyframes flip{to{transform:translateY(0) rotateY(1080deg)}}
nav button.logo,nav button.logo:hover{background:linear-gradient(90deg,#fff,#9fc0ff,#f2b84b,#fff) 0 0/300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent}
nav button.logo:hover{transform:scale(1.05)}
.mhome{display:none;font:800 18px var(--head);background:linear-gradient(90deg,#fff,#9fc0ff,#f2b84b,#fff) 0 0/300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 7s linear infinite}
@media (max-width:760px){.mhome{display:block}}
.title{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;
  transition:opacity .4s,transform .4s,visibility 0s}
.title.hide{opacity:0;transform:scale(1.06);pointer-events:none;visibility:hidden;transition:opacity .4s,transform .4s,visibility 0s .4s}
body.on-title .app{visibility:hidden}
@keyframes sworddrop{from{transform:translateY(-90px) rotate(-25deg);opacity:0}}
.tt{font:800 clamp(52px,13vw,128px)/1.05 var(--head);background:linear-gradient(90deg,#fff,#9fc0ff,#f2b84b,#fff);background-size:300% 100%;
  -webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 26px rgba(127,168,255,.5));
  animation:shine 7s linear infinite,tin2 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes tin2{from{opacity:0;letter-spacing:.35em;filter:blur(12px)}}
.tsub{color:#cfd6ee;font-size:18px;animation:fadeup .8s .5s both}
.menu{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:10px;animation:fadeup .8s .8s both}
.menu .btn{padding:14px 28px;font-size:16px}
.thint{color:var(--mute);font-size:13px;animation:fadeup .8s 1.1s both}
@keyframes fadeup{from{opacity:0;transform:translateY(14px)}}
html,body{overflow:hidden}
body{height:100vh;height:100dvh}
.app{grid-template-rows:minmax(0,1fr)}
main{min-height:0;overflow:hidden}
nav{overflow-y:auto;min-height:0}
.view{min-height:0;overscroll-behavior:contain}
.title{overflow:auto}
.tt{font-size:clamp(44px,min(13vw,16vh),128px)}
@media (max-width:760px){.app{grid-template-rows:minmax(0,1fr) auto}nav{overflow-x:auto;overflow-y:hidden}}
@media (max-height:620px){
  .title{gap:8px}.tsub{font-size:15px}.menu .btn{padding:10px 20px}
  .hero{padding:18px 22px;margin-bottom:16px}.hero h2{font-size:24px}
  header{padding:10px 16px}.view{padding:16px}.big{font-size:40px}
}
.lobby{width:min(100%,max(320px,calc((100dvh - 250px)*16/9)));max-width:960px;aspect-ratio:16/9;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#000;box-shadow:0 10px 40px rgba(0,0,0,.45)}
.lobby canvas{width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
.lobby{position:relative}
.pp{position:absolute;right:12px;top:12px;width:250px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px;backdrop-filter:blur(8px);z-index:2;font-size:14px}
.slot{padding:7px 10px;margin-top:6px;background:rgba(255,255,255,.06);border-radius:8px}
.info{display:grid;grid-template-columns:minmax(0,260px) 1fr;gap:28px;max-width:860px;align-items:start}
.iart{aspect-ratio:1;border-radius:18px;display:grid;place-items:center;font-size:90px;border:1px solid var(--line)}
.info h3{font:700 16px var(--head);margin:16px 0 6px}
.how{padding-left:20px;color:var(--mute);margin-bottom:20px}
@media (max-width:760px){.info{grid-template-columns:1fr}.iart{max-width:180px;font-size:70px}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important}}

.hero{background:linear-gradient(120deg,#16306e,#2a2a78 55%,#1b5a86)}
.hero .ann{margin:0 0 10px;background:rgba(242,184,75,.18);color:var(--gold);font-weight:700}
.hero .v2{position:relative;font:800 72px/1 var(--head);color:transparent;-webkit-text-stroke:2px rgba(255,255,255,.55);background:linear-gradient(90deg,#fff,#9fc0ff,#f2b84b);-webkit-background-clip:text;background-clip:text;animation:bob 3.5s ease-in-out infinite;padding-right:10px}
@keyframes bob{50%{transform:translateY(-8px)}}
.lobby{width:100%;max-width:none;aspect-ratio:16/9;border-radius:12px;background:#dfe9f6}
.win{position:fixed;z-index:40;display:flex;flex-direction:column;background:rgba(8,14,40,.94);border:1px solid var(--line);border-radius:14px;overflow:hidden;
  box-shadow:0 24px 60px rgba(0,0,0,.6);backdrop-filter:blur(14px);animation:winin .22s cubic-bezier(.2,.9,.3,1.1)}
@keyframes winin{from{opacity:0;transform:scale(.94) translateY(10px)}}
.win.focus{border-color:rgba(127,168,255,.6);box-shadow:0 24px 60px rgba(0,0,0,.6),0 0 0 1px rgba(127,168,255,.25)}
.win.min{display:none}

/* ---------- Music and sound effects (all synthesized in the browser, no files) ---------- */
const AUD=(()=>{
  let ctx=null,out,sfx,nb=null;
  const P=Object.assign({on:true,s:.8},store.get('audio',{}));
  const gains=()=>{if(!ctx)return;out.gain.value=P.on?1:0;sfx.gain.value=P.s*.8};
  const inGame=()=>typeof WM!=='undefined'&&WM.wins.some(w=>w.id===WM.active&&!w.el.classList.contains('min'));
  function init(){
    if(ctx){if(ctx.state==='suspended')ctx.resume();return}
    try{ctx=new(window.AudioContext||window.webkitAudioContext)();out=ctx.createGain();sfx=ctx.createGain();sfx.connect(out);out.connect(ctx.destination);gains();
      const n=ctx.sampleRate*1.5|0;nb=ctx.createBuffer(1,n,ctx.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1}catch(e){ctx=null}
  }
  function tone(f,t,d,type,v,dst,to){const o=ctx.createOscillator(),g=ctx.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(to)o.frequency.exponentialRampToValueAtTime(to,t+d);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(dst);o.start(t);o.stop(t+d+.03)}
  function noise(t,d,v,dst,f0,f1){const s=ctx.createBufferSource(),g=ctx.createGain(),fl=ctx.createBiquadFilter();s.buffer=nb;fl.type='bandpass';fl.frequency.setValueAtTime(f0,t);if(f1)fl.frequency.exponentialRampToValueAtTime(f1,t+d);
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(fl);fl.connect(g);g.connect(dst);s.start(t);s.stop(t+d)}
  const S={
    click:t=>tone(700,t,.06,'square',.12,sfx),
    coin:t=>{tone(988,t,.08,'square',.14,sfx);tone(1319,t+.07,.18,'square',.14,sfx)},
    gem:t=>{tone(1200,t,.1,'triangle',.2,sfx);tone(1800,t+.06,.2,'triangle',.18,sfx)},
    jump:t=>tone(300,t,.16,'square',.1,sfx,720),
    land:t=>noise(t,.07,.18,sfx,300,120),
    hit:t=>{noise(t,.09,.35,sfx,900,300);tone(160,t,.1,'sawtooth',.18,sfx,70)},
    place:t=>{tone(220,t,.07,'square',.16,sfx,140);noise(t,.05,.12,sfx,500)},
    brk:t=>{noise(t,.18,.35,sfx,1200,200);tone(120,t,.12,'sawtooth',.14,sfx,50)},
    throw:t=>noise(t,.22,.2,sfx,400,1800),
    boom:t=>{noise(t,.6,.7,sfx,500,60);tone(90,t,.5,'sawtooth',.35,sfx,30)},
    bed:t=>{tone(180,t,.6,'sawtooth',.3,sfx,60);noise(t,.5,.4,sfx,700,90)},
    kill:t=>{tone(520,t,.12,'square',.18,sfx,260);tone(260,t+.1,.2,'square',.18,sfx,130)},
    die:t=>tone(380,t,.35,'sawtooth',.18,sfx,70),
    respawn:t=>{tone(440,t,.1,'triangle',.2,sfx);tone(660,t+.08,.14,'triangle',.2,sfx)},
    win:t=>[523,659,784,1047].forEach((f,i)=>tone(f,t+i*.11,.3,'triangle',.25,sfx)),
    lose:t=>[392,349,311,262].forEach((f,i)=>tone(f,t+i*.16,.36,'sawtooth',.15,sfx)),
    card:t=>noise(t,.07,.25,sfx,2500,800),
    chip:t=>{tone(1500,t,.05,'square',.09,sfx);tone(1100,t+.04,.07,'square',.09,sfx)},
    spin:t=>tone(300+Math.random()*400,t,.05,'square',.07,sfx),
    move:t=>{tone(300,t,.05,'triangle',.25,sfx);noise(t,.04,.12,sfx,800)},
    cap:t=>{tone(200,t,.1,'square',.22,sfx,110);noise(t,.08,.25,sfx,1000)},
    check:t=>{tone(880,t,.1,'square',.18,sfx);tone(880,t+.14,.14,'square',.18,sfx)},
    bounce:t=>tone(250,t,.28,'sine',.3,sfx,900),
    crumble:t=>noise(t,.3,.3,sfx,300,90),
    lava:t=>{noise(t,.35,.35,sfx,600,100);tone(200,t,.3,'sawtooth',.14,sfx,60)},
    flag:t=>{tone(660,t,.1,'triangle',.2,sfx);tone(990,t+.09,.16,'triangle',.2,sfx)},
    tick:t=>tone(880,t,.07,'square',.13,sfx),
    go:t=>tone(1320,t,.3,'square',.18,sfx),
    err:t=>tone(150,t,.15,'square',.18,sfx),
    buy:t=>{tone(700,t,.06,'square',.14,sfx);tone(1050,t+.06,.1,'square',.14,sfx)},
    fin:t=>[660,880,1320].forEach((f,i)=>tone(f,t+i*.07,.2,'triangle',.22,sfx)),
    jackpot:t=>{for(let i=0;i<8;i++)tone(600+i*110,t+i*.06,.18,'square',.14,sfx)},
  };
  const play=n=>{if(!ctx||!P.on||!S[n]||!inGame())return;try{S[n](ctx.currentTime+.005)}catch(e){}};
  function ui(){
    const b=el('button','audbtn','🔊'),p=el('div','audpanel');p.hidden=true;b.title='Game sound effects';
    p.innerHTML='<label>Effects<input type="range" min="0" max="1" step=".05" data-k="s"></label><label class="chk"><input type="checkbox" data-k="on"> Sound effects (games only)</label>';
    const sync=()=>{p.querySelector('[data-k=s]').value=P.s;p.querySelector('[data-k=on]').checked=P.on;b.textContent=P.on&&P.s>0?'🔊':'🔇'};
    p.addEventListener('input',e=>{const k=e.target.dataset.k;if(!k)return;P[k]=k==='on'?e.target.checked:+e.target.value;gains();store.set('audio',P);sync()});
    b.onclick=()=>{init();p.hidden=!p.hidden};sync();
    $('header .coins').before(b);document.body.append(p);
  }
  ['pointerdown','keydown','touchstart'].forEach(ev=>addEventListener(ev,init,{passive:true}));
  return{init,sfx:play,music:()=>{},ui};
})();

/* ---------- Touch controls: joystick and action buttons for phones and tablets ---------- */
function touchUI(wrap,cfg){
  if(!(matchMedia('(pointer:coarse)').matches||window.__touch))return()=>{};
  const ui=el('div','tui');wrap.append(ui);
  const down={},key=(k,d)=>{if(!!down[k]===d)return;down[k]=d;dispatchEvent(new KeyboardEvent(d?'keydown':'keyup',{key:k}))};
  if(cfg.stick){
    const st=el('div','tstick','<i></i>'),nub=st.firstChild;ui.append(st);let id=null;
    const upd=e=>{const r=st.getBoundingClientRect(),R=r.width/2;let dx=e.clientX-(r.left+R),dy=e.clientY-(r.top+R);const m=Math.hypot(dx,dy);if(m>R){dx*=R/m;dy*=R/m}
      nub.style.transform=`translate(${dx}px,${dy}px)`;const th=R*.28;key('d',dx>th);key('a',dx<-th);if(!cfg.noY){key('s',dy>th);key('w',dy<-th)}};
    st.addEventListener('pointerdown',e=>{id=e.pointerId;st.setPointerCapture(id);upd(e);e.preventDefault()});
    st.addEventListener('pointermove',e=>{if(e.pointerId===id)upd(e)});
    const end=e=>{if(e.pointerId!==id)return;id=null;nub.style.transform='';['a','d','w','s'].forEach(k=>key(k,false))};
    st.addEventListener('pointerup',end);st.addEventListener('pointercancel',end);
  }
  const bt=el('div','tbtns');ui.append(bt);
  cfg.buttons.forEach(b=>{
    const x=el('button','tb'+(b.big?' big':''),b.t);
    const dn=e=>{e.preventDefault();x.classList.add('on');if(b.fn)b.fn();else{key(b.k,true);if(b.tap)setTimeout(()=>key(b.k,false),70)}};
    const up=()=>{x.classList.remove('on');if(!b.fn&&!b.tap)key(b.k,false)};
    x.addEventListener('pointerdown',dn);x.addEventListener('pointerup',up);x.addEventListener('pointercancel',up);x.addEventListener('pointerleave',up);bt.append(x);
  });
  return()=>{Object.keys(down).forEach(k=>down[k]&&key(k,false));ui.remove()};
}

/* ---------- Intermission room: 30 seconds, then bots fill the empty slots ---------- */
function lobbyRoom(g,box,win,cfg,start){
  const secs=cfg.secs||30,humans=cfg.groups.flatMap(x=>x.humans);
  const need=cfg.groups.reduce((a,x)=>a+x.size-x.humans.length,0),pool=[],used=new Set([user,...humans]);
  let bi=0,gd=0;while(pool.length<need&&gd++<500){const c=botCos(++bi);if(used.has(c.name))continue;used.add(c.name);pool.push(c)}
  box.innerHTML='';const room=el('div','room');box.append(room);
  const clock=el('div','rclock',String(secs)),bar=el('div','rbar','<i></i>'),slots=el('div','rgroups');
  const row=el('div','row'),go=el('button','btn gold','Start now'),lv=el('button','btn alt','Leave');row.append(go,lv);
  const h=el('h2','',(g.ico||'')+' '+g.name);
  room.append(h,el('p','rsub','Intermission'),clock,bar,slots,el('p','note','Empty slots are filled with bots when the timer reaches zero. Bots have blue names.'),row);
  const cells=[];
  cfg.groups.forEach(gr=>{const d=el('div','rgroup');const t=el('strong');t.textContent=gr.title;if(gr.color)t.style.color=gr.color;d.append(t);
    for(let i=0;i<gr.size;i++){const c=el('div','rslot');if(gr.humans[i]){c.textContent=gr.humans[i]+(i===0&&gr.host?'  (you, host)':'');c.classList.add('hum')}else{c.textContent='Waiting for player...';c.classList.add('wait');cells.push(c)}d.append(c)}slots.append(d)});
  AUD.music('hub');
  let left=secs,iv=null,tm=null,inner=null,done=false;
  const begin=()=>{if(done)return;done=true;clearInterval(iv);go.disabled=true;let k=0;
    const fill=()=>{if(k<cells.length){const c=cells[k],b=pool[k++];c.textContent=b.name;c.className='rslot bot';const tag=el('span','btag','BOT');c.append(tag);AUD.sfx('chip');tm=setTimeout(fill,110)}
      else tm=setTimeout(()=>{inner=start(pool)},650)};
    clock.textContent='Go!';AUD.sfx('go');fill()};
  iv=setInterval(()=>{if(win.el.classList.contains('min'))return;left-=.1;const s=Math.max(0,Math.ceil(left));if(clock.textContent!==String(s)&&left>0){clock.textContent=String(s);if(s<=5)AUD.sfx('tick')}
    bar.firstChild.style.width=Math.max(0,left/secs*100)+'%';if(left<=0)begin()},100);
  go.onclick=begin;lv.onclick=()=>closeWin(win);
  return()=>{clearInterval(iv);clearTimeout(tm);if(inner)inner()};
}

/* ---------- Views ---------- */
let view='games',cat='All',timer=null,stopLoop=null;
function stopTimer(){clearInterval(timer);timer=null;if(stopLoop){stopLoop();stopLoop=null}}
function go(v){stopTimer();view=v;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));render()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
$('#q').oninput=()=>{if(view!=='games')go('games');else render()};

function render(){
  const v=$('#view');v.innerHTML='';
  if(view==='games')return renderGames(v);
  if(view==='chat')return renderChat(v);
  if(view==='friends')return renderFriends(v);
  if(view==='account')return renderAccount(v);
  if(view.startsWith('info:'))return renderInfo(v,GAMES.find(g=>g.id===view.slice(5)));
}

function renderGames(v){
  const q=$('#q').value.trim().toLowerCase();
  if(!q&&(cat==='All'||cat==='Official'))v.append(el('div','hero',`<div><span class="tag ann">📢 Latest</span><h2>Announcements</h2>
    <p>V2 is now out! Check out the new games, and have fun! New chatting system and multiplayer.</p></div>
    <div class="v2">V2</div>`));
  v.append(el('h1','','Games'),el('p','sub',QUIPS[Math.floor(Math.random()*QUIPS.length)]));
  const all=[...new Set(GAMES.map(g=>g.cat))],cats=all.length>1?['All',...all]:all;
  const chips=el('div','chips');
  cats.forEach(c=>{const b=el('button','chip'+(c===cat||cats.length===1?' on':''),c);b.onclick=()=>{cat=c;render()};chips.append(b)});
  v.append(chips);
  const grid=el('div','grid');
  GAMES.filter(g=>(cat==='All'||g.cat===cat)&&g.name.toLowerCase().includes(q)).forEach((g,i)=>{
    const c=el('button','card'+(g.soon?' soon':''));c.style.setProperty('--i',i);c.style.setProperty('--h',g.hue||220);
    c.innerHTML=`<div class="art" style="background:linear-gradient(135deg,hsl(${g.hue||220} 55% 32%),hsl(${(g.hue||220)+40} 60% 18%))">${g.ico||g.name[0]}</div>
      <div class="txt"><strong></strong><span></span><br><i class="tag" style="font-style:normal"></i></div>`;
    c.querySelector('strong').textContent=g.name;
    c.querySelector('span').textContent=g.desc;

    grid.append(c);
  });
  if(!grid.children.length)v.append(el('p','sub','No games match that search.'));
  v.append(grid);

/* ---------- Window system: every game opens in its own window ---------- */
const WM={wins:[],z:40,active:null,n:0},NR_PK=8;
function fitStage(box,stage){
  const run=()=>{
    const bw=box.clientWidth-2;if(bw<50)return;
    let oh=0;[...box.children].forEach(c=>{if(c===stage)return;const cs=getComputedStyle(c);oh+=c.offsetHeight+(parseFloat(cs.marginTop)||0)+(parseFloat(cs.marginBottom)||0)});
    const ah=Math.max(150,box.clientHeight-oh-6),w=Math.max(200,Math.min(bw,ah*16/9));
    stage.style.width=w+'px';stage.style.height=(w*9/16)+'px';stage.style.maxWidth='none';stage.style.margin='0 auto';
    if(bw<520&&box.clientHeight>bw*1.4&&!box.querySelector('.rothint'))box.append(el('p','note rothint','Tip: turn your phone sideways for a bigger game view.'));
    const cv0=stage.querySelector('canvas');
    if(cv0){const k=Math.min(2,Math.max(1,w/960*(window.devicePixelRatio||1))),nw=Math.round(960*k);if(cv0.width!==nw){cv0.width=nw;cv0.height=Math.round(540*k)}cv0.getContext('2d').setTransform(nw/960,0,0,nw/960,0,0)}
  };
  const ro=new ResizeObserver(run);ro.observe(box);run();
  return()=>ro.disconnect();
}
/* ---------- online matches: intermission, roster, and handing over to the game ---------- */
function mpRoster(kind,hum){
  const used=new Set(hum.map(h=>h.name));let bi=Math.floor(Math.random()*500),gd=0;
  const bot=()=>{let c=botCos(++bi);while((used.has(c.name)||!c.name)&&gd++<400)c=botCos(++bi);used.add(c.name);return{name:c.name,skin:c.skin,hat:c.hat,rain:false,bot:true}};
  const out=[];
  if(kind==='bedwars'){
    const TS=Math.max(1,Math.min(4,Math.ceil(hum.length/4))),tm=[[],[],[],[]];hum.forEach((h,k)=>tm[k%4].push(h));
    tm.forEach((m,ti)=>{while(m.length<TS)m.push(bot());m.forEach(x=>out.push({...x,team:ti}))});
  }else{
    const SK=[.97,.9,.82,.74,.66,.58,.5].sort(()=>Math.random()-.5);hum.slice(0,NR_PK).forEach(h=>out.push({...h}));
    while(out.length<NR_PK){const b=bot();b.skill=SK.pop()||.7;out.push(b)}
  }
  return out;
}
function mpRoom(g,box,win,kind,onStart,solo){
  const MAX=kind==='bedwars'?16:8;
  box.innerHTML='';const room=el('div','room');box.append(room);
  const clock=el('div','rclock','...'),bar=el('div','rbar','<i></i>'),slots=el('div','rgroups'),note=el('p','note');
  const row=el('div','row'),go=el('button','btn gold','Start now'),bots=el('button','btn alt','Play with bots only'),lv=el('button','btn alt','Leave');row.append(go,bots,lv);
  room.append(el('h2','',(g.ico||'')+' '+g.name),el('p','rsub','Online intermission'),clock,bar,slots,note,row);
  let s=null,secs=30,total=30,dead=false,inner=null,tm=0;
  const hum=()=>{
    const a=[{pid:NET.id,name:user,skin:cosOf(eq.skin).c,rain:isRainbow(eq.skin),hat:eq.hat,acct:signedIn}];
    if(s)for(const p of s.players.values())a.push({pid:p.id,name:p.name,skin:p.skin,rain:!!p.rain,hat:p.hat,acct:!!p.acct});
    const m=s&&s.masterId;a.sort((x,y)=>(y.pid===m)-(x.pid===m));return a;
  };
  function draw(){
    if(dead||inner)return;const h=hum(),isM=!!s&&s.isMaster();
    clock.textContent=s?String(Math.max(0,secs)):'...';bar.firstChild.style.width=(s?Math.max(0,secs)/total*100:0)+'%';
    slots.innerHTML='';const d=el('div','rgroup'),t=el('strong');t.textContent='Players  '+h.length+'/'+MAX;d.append(t);
    h.forEach(x=>{const c=el('div','rslot hum');c.textContent=(x.acct?'✓ ':'')+x.name+(x.pid===NET.id?'  (you)':'')+(s&&x.pid===s.masterId?'  (host)':'');d.append(c)});
    for(let i=h.length;i<Math.min(MAX,h.length+2);i++){const c=el('div','rslot wait');c.textContent='Waiting for player...';d.append(c)}
    slots.append(d);go.hidden=!isM;
    note.textContent=!s?'Looking for a match...':isM?'You are the host: the game runs in your browser, so keep this tab open. Empty slots are filled with bots when the timer reaches zero.':'Waiting for the host to start. Empty slots are filled with bots.';
  }
  function begin(a){
    if(dead||inner)return;
    if(!a.roster.some(r=>r.pid===NET.id)){note.textContent='That match started without you. Finding another...';if(s)s.leave();s=null;clearInterval(tm);setTimeout(find,400);return}
    clearInterval(tm);inner=onStart({sess:s,roster:a.roster,seed:a.seed,master:s.isMaster()});
  }
  function start(){
    if(!s||!s.isMaster()||inner)return;clearInterval(tm);
    const roster=mpRoster(kind,hum()),seed=Math.floor(Math.random()*2e9)+1;
    NET.sendRaw({t:'lock'});s.rpc('go',{roster,seed},'others');begin({roster,seed});
  }
  function run(){
    clearInterval(tm);
    tm=setInterval(()=>{if(!s||!s.isMaster()||inner)return;secs--;if(hum().length>=MAX&&secs>5)secs=5;s.rpc('clock',{s:secs,t:total},'others');draw();if(secs<=0)start()},1000);
  }
  function wire(){

function drawAvatar(c,x,y,o){
  const TAU=6.283,s=o.s||1,d=o.dir||0,t=o.t||0,mv=!!o.moving,ph=mv?Math.sin(o.walk):0;
  const bob=mv?Math.abs(Math.cos(o.walk))*2.2:Math.sin(t*2.5)*.8;

  c.fillStyle=dk;
  if(d>1){rrp(c,-4+ph*5,-12,8,12,4);c.fill();rrp(c,-4-ph*5,-12,8,12,4);c.fill()}
  else{rrp(c,-10,-12-Math.max(0,ph)*3,8,12,4);c.fill();rrp(c,2,-12-Math.max(0,-ph)*3,8,12,4);c.fill()}
  const cy=-26-bob;
  const arm=(ax,ang)=>{c.save();c.translate(ax,cy-1);c.rotate(ang);rrp(c,-3.5,-2,7,15,3.5);c.fill();c.restore()};
  c.fillStyle=dk;
  if(d<=1){arm(-14,.5+ph*.5);arm(14,-.5-ph*.5)}
  const g=c.createRadialGradient(-6,cy-8,2,0,cy,22);g.addColorStop(0,lt);g.addColorStop(1,col);
  c.fillStyle=g;c.beginPath();c.ellipse(0,cy,15,17,0,0,TAU);c.fill();c.strokeStyle=dk;c.lineWidth=1.5;c.stroke();
  if(d>1){c.fillStyle=dk;arm(d===2?3:-3,(d===2?-1:1)*ph*.9)}
  if(d!==1){
    const fx=d===2?-5:d===3?5:0,sp=d>1?3.8:5.5;

}

function evalHand(cs){
  const cnt={};cs.forEach(c=>cnt[c.r]=(cnt[c.r]||0)+1);
  const groups=Object.entries(cnt).map(([r,n])=>[+r,n]).sort((a,b)=>b[1]-a[1]||b[0]-a[0]);
  const straight=arr=>{const u=[...new Set(arr)].sort((a,b)=>b-a);if(u[0]===14)u.push(1);let run=1;for(let i=1;i<u.length;i++){if(u[i]===u[i-1]-1){if(++run>=5)return u[i-4]}else run=1}return 0};
  const suited=[0,1,2,3].map(s=>cs.filter(c=>c.s===s).map(c=>c.r).sort((a,b)=>b-a)).find(a=>a.length>=5);
  const sf=suited&&straight(suited);if(sf)return[8,sf];
  if(groups[0][1]===4)return[7,groups[0][0],Math.max(...cs.map(c=>c.r).filter(r=>r!==groups[0][0]))];
  if(groups[0][1]===3&&groups[1]&&groups[1][1]>=2)return[6,groups[0][0],groups[1][0]];
  if(suited)return[5,...suited.slice(0,5)];
  const st=straight(cs.map(c=>c.r));if(st)return[4,st];
  const kick=ex=>cs.map(c=>c.r).filter(r=>!ex.includes(r)).sort((a,b)=>b-a);
  if(groups[0][1]===3)return[3,groups[0][0],...kick([groups[0][0]]).slice(0,2)];
  if(groups[0][1]===2&&groups[1]&&groups[1][1]===2)return[2,groups[0][0],groups[1][0],...kick([groups[0][0],groups[1][0]]).slice(0,1)];
  if(groups[0][1]===2)return[1,groups[0][0],...kick([groups[0][0]]).slice(0,3)];
  return[0,...kick([]).slice(0,5)];
}

  function click(i){

      if(cand.length){if(cand.length>1&&cand[0].p){promo=cand;showPromo();return}AUD.sfx('click');play(cand[0]);return}}

    status.style.color=over?'#f2b84b':'';
    ml.innerHTML='';for(let i=0;i<hist.length;i+=2){const d=el('div');d.textContent=(i/2+1)+'. '+hist[i].txt+(hist[i+1]?'   '+hist[i+1].txt:'');ml.append(d)}ml.scrollTop=1e9;
    const cw=hist.filter(h=>h.u.cap<0||(h.m.e&&Math.sign(h.u.pc)===1)).map(h=>h.u.cap||-1),cb=hist.filter(h=>h.u.cap>0||(h.m.e&&Math.sign(h.u.pc)===-1)).map(h=>h.u.cap||1);
    capW.textContent='Captured by White  '+cw.sort((a,b)=>a-b).map(v=>GL[Math.abs(v)]).join(' ');capB.textContent='Captured by Black  '+cb.sort((a,b)=>b-a).map(v=>GL[Math.abs(v)]).join(' ');
    const w=root.querySelector('#cbal2');if(w)w.textContent='🪙 '+coins.toLocaleString();ub.disabled=thinking||!hist.length;
  }
  /*HOOKCH*/
  draw();
  return()=>{clearTimeout(tm);ro.disconnect()};
}

/* ---------- Rooms and networking ----------
   Online: the page opens a WebSocket to its own server (wss://this-host/ws), or to a server you set with
   window.EXCALIBUR_SERVER, ?server=wss://... in the address bar, or localStorage 'serverUrl'.
   Offline (file://, or the server can't be reached): rooms connect tabs on this device through BroadcastChannel.
   Either way the game only talks to NET, and the messages are the same:
     join {room,p,meta}  joincode {code,req,p}  who {}  state {room,s}  chat {room,text}  leave {room}
   from the server: welcome {id}  rooms {rooms}  roster {room,players,meta}  join {room,p}  deny {err}  state  chat  leave  notice  */
const NET=(()=>{
  let id='p'+Math.random().toString(36).slice(2,9);
  const KINDS={hub:{label:'Main Hub',max:16},casino:{label:'Casino',max:12}};
  const rooms=new Map(),sessions=new Set(),waiters=new Map();
  let ch=null,ws=null,online=false,retry=0,rtimer=0,serverUrl='',custom=null,connecting=false,ice=[{urls:'stun:stun.l.google.com:19302'}];
  let readyRes;const ready=new Promise(r=>{readyRes=r});
  function openLocal(){if(ch)return;try{ch=new BroadcastChannel('excalibur-net-v1');ch.onmessage=e=>{if(!online&&!custom)receive(e.data)}}catch(e){ch=null}}
  function send(m){
    m.from=id;if(custom)return custom.send(m);
    if(online){if(ws&&ws.readyState===1)ws.send(JSON.stringify(m));return}
    openLocal();if(ch)ch.postMessage(m);
  }
  function receive(m){
    if(!m||m.from===id)return;
    switch(m.t){
      case'who':if(!online)for(const s of sessions)s.announce();return;
      case'room':rooms.set(m.room.id,{...m.room,seen:Date.now()});return;
      case'rooms':rooms.clear();for(const r of m.rooms)rooms.set(r.id,{...r,seen:Date.now()});return;
      case'notice':toast(m.text);return;
      case'deny':{const w=m.req&&waiters.get(m.req);if(w){w({err:m.err});return}for(const s of sessions)if(s.room.id===m.room&&s.onDeny)s.onDeny(m.err);return}
      case'roster':{const w=m.req&&waiters.get(m.req);if(w){w({roster:m});return}break}
    }
    for(const s of sessions)if(s.room.id===m.room)s.recv(m);
  }
  const me=()=>({id,name:user,skin:cosOf(eq.skin).c,rain:isRainbow(eq.skin),hat:eq.hat});
  const mkCode=()=>Math.random().toString(36).slice(2,7).toUpperCase();
  const fresh=()=>{const now=Date.now();for(const[k,r]of rooms)if(now-r.seen>6500)rooms.delete(k)};
  function list(kind){fresh();return[...rooms.values()].filter(r=>r.kind===kind&&!r.priv).sort((a,b)=>a.name.localeCompare(b.name,undefined,{numeric:true}))}
  function byCode(c){fresh();c=(c||'').trim().toUpperCase();return[...rooms.values()].find(r=>r.code===c)||null}
  function make(kind,o){o=o||{};const K=KINDS[kind];return{id:'r'+Math.random().toString(36).slice(2,9),kind,name:((o.name||'').trim().slice(0,24))||K.label+' '+(list(kind).length+1),
    max:Math.max(2,Math.min(K.max,o.max||K.max)),priv:!!o.priv,code:mkCode(),count:0}}
  function join(room,offline){
    if(!offline&&room.count>=room.max)return{err:'That room is full.'};
    return{session:new Session({...room},offline)};
  }
  function joinCode(c){
    c=(c||'').trim().toUpperCase();
    if(!online){const r=byCode(c);return Promise.resolve(r?join(r):{err:'No room with that code.'})}
    return new Promise(res=>{
      const req='q'+Math.random().toString(36).slice(2,8),t=setTimeout(()=>{waiters.delete(req);res({err:'The server did not answer.'})},2500);
      waiters.set(req,r=>{clearTimeout(t);waiters.delete(req);if(r.err)return res(r);const m=r.roster,s=new Session({...m.meta,count:m.players.length+1,code:m.meta.code||c},false,true);s.recv(m);res({session:s})});
      send({t:'joincode',code:c,req,p:me()});
    });
  }
  function joinFriend(name){
    if(!online)return Promise.resolve({err:'You are offline.'});
    return new Promise(res=>{
      const req='f'+Math.random().toString(36).slice(2,8),t=setTimeout(()=>{waiters.delete(req);res({err:'The server did not answer.'})},4000);
      waiters.set(req,r=>{clearTimeout(t);waiters.delete(req);if(r.err)return res(r);const m=r.roster,s=new Session({...m.meta,count:m.players.length+1,code:m.meta.code},false,true);s.recv(m);res({session:s})});
      send({t:'friend.join',name,req,p:me()});
    });
  }
  const fail=(req,err)=>{const w=waiters.get(req);if(w){w({err});return true}return false};
  class Session{
    constructor(room,offline,joined){
      this.room=room;this.offline=!!offline;this.players=new Map();this.ambient=[];this.me={bubble:'',bt:0};this.cfg={spots:[[0,0]]};this.sent=0;this.log=[];
      this.onChange=null;this.onChat=null;this.onDeny=null;this.onJoin=null;this.onLeave=null;this.onMaster=null;this.masterId=null;this.handlers={};this.pos=null;this.prox=false;this.dead=false;sessions.add(this);
      if(!this.offline){if(!joined)this.sendJoin();if(!online)this.announce();this.iv=setInterval(()=>this.beat(),2000)}
    }
    sendJoin(){send({t:'join',room:this.room.id,p:me(),meta:{kind:this.room.kind,name:this.room.name,max:this.room.max,priv:this.room.priv}})}
    rejoin(){if(this.offline||this.dead)return;this.players.clear();this.sendJoin();this.changed()}
    connLost(){this.players.clear();this.changed()}
    humans(){return this.players.size+1}
    /* Master client: one player per room is in charge of shared state. The server picks the first player in and hands over when they leave. */
    isMaster(){if(this.offline)return true;if(online)return this.masterId===id;return[id,...this.players.keys()].sort()[0]===id}
    /* RPC: call a named function on other players. target is 'others' (default), 'all', 'master' or a player id. */
    on(name,fn){this.handlers[name]=fn}
    rpc(name,args,target){
      target=target||'others';if(!this.offline)send({t:'rpc',room:this.room.id,name,args,target});
      if(target==='all'||target===id||(target==='master'&&this.isMaster()))this.dispatch(id,name,args);
    }
    dispatch(from,name,args){const f=this.handlers[name];if(f)try{f(from,args)}catch(e){console.error('rpc '+name,e)}}
    announce(){if(this.offline||online)return;this.room.count=this.humans();send({t:'room',room:{...this.room}})}
    beat(){
      this.announce();if(online)return;
      const now=Date.now();let c=false;for(const[k,p]of this.players)if(now-p.seen>9000){this.players.delete(k);c=true}if(c)this.changed();
    }
    changed(){this.sync();if(this.onChange)this.onChange()}
    add(p){const old=this.players.get(p.id);this.players.set(p.id,{...(old||{x:0,y:0,tx:0,ty:0,dir:0,mv:false,wk:0,bubble:'',bt:0,init:false}),...p,seen:Date.now(),bot:false});if(!old)this.changed()}
    recv(m){
      const now=Date.now();
      if(m.t==='join'){this.add(m.p);if(!online){send({t:'here',room:this.room.id,to:m.p.id,p:me()});this.announce()}if(this.onJoin)this.onJoin(m.p)}
      else if(m.t==='here'){if(m.to===id)this.add(m.p)}
      else if(m.t==='roster'){if(m.meta)Object.assign(this.room,m.meta);this.masterId=m.master||null;for(const p of m.players)this.add(p);this.changed()}
      else if(m.t==='master'){this.masterId=m.id;if(this.onMaster)this.onMaster()}
      else if(m.t==='rpc'){const tg=m.target;if(tg){if(tg==='master'&&!this.isMaster())return;if(tg!=='others'&&tg!=='all'&&tg!=='master'&&tg!==id)return}this.dispatch(m.from,m.name,m.args)}
      else if(m.t==='state'){let p=this.players.get(m.from);if(!p){this.add({id:m.from,name:'Player'});p=this.players.get(m.from)}
        p.tx=m.s.x;p.ty=m.s.y;p.dir=m.s.dir;p.mv=m.s.mv;p.wk=m.s.wk;p.seen=now;if(!p.init){p.x=p.tx;p.y=p.ty;p.init=true}}
      else if(m.t==='chat'){const p=this.players.get(m.from);if(p&&!ACC.isBlocked(p.name)){p.bubble=m.text;p.bt=5;p.seen=now;this.said(p.name,m.text)}}
      else if(m.t==='leave'){if(this.onLeave)this.onLeave(m.from);if(this.players.delete(m.from))this.changed();if(!online&&this.onMaster&&this.isMaster())this.onMaster()}
    }
    said(n,t){this.log.push({n,t});if(this.log.length>30)this.log.shift();if(this.onChat)this.onChat(n,t)}
    say(text){text=String(text).slice(0,60);if(!text)return;this.me.bubble=text;this.me.bt=5;this.said(user,text);if(!this.offline)send({t:'chat',room:this.room.id,text})}
    sendState(P){this.pos={x:P.x,y:P.y};if(this.offline)return;const n=performance.now();if(n-this.sent<100)return;this.sent=n;
      send({t:'state',room:this.room.id,s:{x:Math.round(P.x),y:Math.round(P.y),dir:P.dir,mv:!!P.moving,wk:+(P.walk%100).toFixed(2)}})}
    sync(){}
    tick(dt){
      this.me.bt=Math.max(0,this.me.bt-dt);
      for(const p of this.players.values()){p.x+=(p.tx-p.x)*Math.min(1,dt*10);p.y+=(p.ty-p.y)*Math.min(1,dt*10);p.bt=Math.max(0,p.bt-dt)}
    }
    leave(){if(this.dead)return;this.dead=true;if(!this.offline){send({t:'leave',room:this.room.id});clearInterval(this.iv)}sessions.delete(this);this.players.clear()}
  }
  addEventListener('pagehide',()=>[...sessions].forEach(s=>s.leave()));
  function quickLocal(kind){const l=list(kind).filter(r=>r.count<r.max).sort((a,b)=>b.count-a.count);return l.length?join(l[0]):join(make(kind))}
  function quick(kind){
    if(!online)return Promise.resolve(quickLocal(kind));
    return new Promise(res=>{
      const req='k'+Math.random().toString(36).slice(2,8),t=setTimeout(()=>{waiters.delete(req);res({err:'The server did not answer.'})},4000);
      waiters.set(req,r=>{clearTimeout(t);waiters.delete(req);if(r.err)return res(r);const m=r.roster,s=new Session({...m.meta,count:m.players.length+1},false,true);s.recv(m);res({session:s})});

    });
  }

  /* ---- the online connection ---- */
  function resolveUrl(){
    try{const q=new URLSearchParams(location.search).get('server');if(q)return q}catch(e){}
    const c=window.EXCALIBUR_SERVER||store.get('serverUrl','');if(c)return c;
    return/^https?:$/.test(location.protocol)?(location.protocol==='https:'?'wss://':'ws://')+location.host+'/ws':'';
  }
  function connect(){

    sock.onopen=()=>{opened=true;clearTimeout(to)};
    sock.onmessage=e=>{let m;try{m=JSON.parse(e.data)}catch(x){return}
      if(m.t==='welcome'){id=m.id;if(Array.isArray(m.ice)&&m.ice.length)ice=m.ice;online=true;connecting=false;retry=0;ACC.config(m);readyRes();for(const s of sessions)s.rejoin();ACC.onWelcome();return}
      if(/^(auth|friend|gift|wallet|g|email|reset|user|report)\./.test(m.t)||m.t==='friends'||m.t==='kicked'){ACC.msg(m);return}

  return{get id(){return id},pending:null,KINDS,list,byCode,make,join,joinCode,joinFriend,fail,quick,receive,ready,refresh:()=>send({t:'who'}),
    online:()=>online,ice:()=>ice,sendRaw:o=>{if(online&&ws&&ws.readyState===1)ws.send(JSON.stringify(o))},
    mode:()=>online?'online':connecting?'connecting':'local',useTransport:t=>{custom=t},sessions:()=>[...sessions]};
})();

/* ---------- Kill effects ---------- */
let FX=[];
function killFx(id,sx,sy){
  const k=id||'k_none';if(k==='k_none')return;
  const TAU2=6.283,n=k==='k_confetti'?34:26;
  for(let i=0;i<n;i++){const a=Math.random()*TAU2,d=40+Math.random()*90;
    FX.push({x:sx,y:sy,vx:Math.cos(a)*d,vy:Math.sin(a)*d-40,l:1,g:260,s:14+Math.random()*26,
      c:k==='k_rainbow'?RAINBOW[i%RAINBOW.length]:k==='k_fire'?['#ffd27a','#ff8a3d','#ff5a5a'][i%3]:k==='k_stars'?'#ffe28a':k==='k_confetti'?RAINBOW[i%RAINBOW.length]:'#ffd27a',
      r:k==='k_confetti'?4:(k==='k_stars'?null:3)})}
  if(k==='k_lightning'||k==='k_pop'||k==='k_fire'){
    FX.push({bolt:true,x:sx,y:sy,l:1,c:k==='k_fire'?'#ffd27a':'#bfe6ff',
      segs:Array.from({length:7},(_,i)=>({x:(Math.random()-.5)*90,y:-60-i*16}))})}
  if(k==='k_rainbow')FX.push({ring:true,x:sx,y:sy,l:1,s:60,c:'#fff'});
}
function fxTick(dt){
  for(let i=FX.length-1;i>=0;i--){const p=FX[i];
    if(p.bolt){p.l-=dt*1.4;if(p.l<=0)FX.splice(i,1);continue}
    if(p.ring){p.s+=380*dt;p.l-=dt*1.1;if(p.l<=0)FX.splice(i,1);continue}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=(p.g||260)*dt;p.l-=dt*.9;if(p.l<=0)FX.splice(i,1)}
}
function fxDraw(c,cam){
  for(const p of FX){
    c.globalAlpha=Math.max(0,Math.min(1,p.l));
    if(p.bolt){c.strokeStyle=p.c;c.lineWidth=2.5;c.beginPath();c.moveTo(p.x-cam.x,p.y-cam.y);
      for(const s of p.segs)c.lineTo(p.x-cam.x+s.x*p.l+Math.random()*6-3,p.y-cam.y+s.y*(1-p.l*.6));c.stroke();continue}
    if(p.ring){c.strokeStyle=RAINBOW[(p.s|0)%RAINBOW.length];c.lineWidth=4;c.beginPath();
      c.arc(p.x-cam.x,p.y-cam.y,p.s/2,0,6.283);c.stroke();continue}
    c.fillStyle=p.c;
    if(p.r===null){c.save();c.translate(p.x-cam.x,p.y-cam.y);c.beginPath();
      for(let i=0;i<10;i++){const a=i/10*6.283-Math.PI/2,r=i%2?p.s*.4:p.s*.9;c.lineTo(Math.cos(a)*r,Math.sin(a)*r)}c.fill();c.restore()}
    else c.fillRect(p.x-cam.x-p.r,p.y-cam.y-p.r,p.r*2,p.r*2)}
  c.globalAlpha=1;
}

  return()=>{net.leave();unfit();stopTouch();cancelAnimationFrame(raf);closePanel();removeEventListener('keydown',kd);removeEventListener('keyup',ku);removeEventListener('blur',bl)};
}

function flipGame(box){
  box.innerHTML=`<div class="panel"><div>Your bet</div>
    <div class="row"><input class="num" id="bet" type="number" min="1" value="10" aria-label="Bet amount">
    <button class="btn" data-s="Heads">Heads</button><button class="btn alt" data-s="Tails">Tails</button></div>
    <div class="coin3d" id="c3"><div>?</div></div>
    <div class="big" id="res">Place a bet</div>
    <p class="note">Play coins only. They have no cash value and can't be bought or cashed out.
    When you add accounts, move this coin flip to the server so players can't edit the result.</p></div>`;
  box.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{
    const bet=Math.floor(+box.querySelector('#bet').value);
    if(!(bet>=1))return toast('Enter a bet of at least 1');
    if(bet>coins)return toast('Not enough coins');
    if(box.busy)return;box.busy=true;
    const c=box.querySelector('#c3'),r=box.querySelector('#res'),pick=b.dataset.s;
    c.classList.remove('flip');void c.offsetWidth;c.classList.add('flip');
    c.firstChild.textContent='?';r.textContent='Flipping...';r.style.color='var(--text)';
    setTimeout(()=>{
      const out=Math.random()<.5?'Heads':'Tails',win=out===pick;
      setCoins(coins+(win?bet:-bet));
      c.firstChild.textContent=out;
      r.textContent=(win?'You won ':'You lost ')+bet;r.style.color=win?'var(--good)':'var(--bad)';
      const q=r.getBoundingClientRect();

      box.busy=false;
    },1000);
  });
}

/* ---------- Accounts, wallet, friends, gifts and global chat (all through the server) ---------- */
const ACC=(()=>{
  let n=0,dt=0;const reqs=new Map(),subs=new Set();
  const blocked=new Map(store.get('blocked',[]).map(n=>[String(n).toLowerCase(),String(n)]));   /* lowercase name -> name as typed */
  const A={name:null,info:null,friends:[],ledger:[],chans:['general','lfg','casino'],ch:{},limits:{giftMax:5000,giftDay:5000},token:store.get('token',''),guest:user,cur:null};
  const fire=w=>subs.forEach(f=>{try{f(w)}catch(e){}});
  const chan=c=>A.ch[c]||(A.ch[c]={msgs:[],n:0});
  A.on=f=>{subs.add(f);return()=>subs.delete(f)};
  A.req=o=>new Promise(res=>{
    if(!NET.online())return res({ok:false,err:'You are offline. Open the game from your server address to use accounts, friends and chat.'});
    const id='a'+(++n);reqs.set(id,res);setTimeout(()=>{if(reqs.delete(id))res({ok:false,err:'The server did not answer. Try again.'})},8000);NET.sendRaw({...o,req:id});
  });
  const done=(m,v)=>{const r=reqs.get(m.req);if(r){reqs.delete(m.req);r(v)}};
  const quiet=c=>{coins=Math.max(0,Math.floor(c));shown=coins;store.set('coins',coins);$('#bal').textContent=coins.toLocaleString();dailyState()};
  function applyWallet(u){quiet(u.coins);xp=u.xp;store.set('xp',xp);drawLv();owned=u.owned.slice();eq={...eq,...u.eq};store.set('owned',owned);store.set('eq',eq)}
  const signed=(v)=>{signedIn=v;if(!v){A.name=null;A.info=null;A.friends=[];A.ledger=[];user=A.guest}setUser();fire('auth')};
  A.config=m=>{if(Array.isArray(m.channels))A.chans=m.channels;if(m.limits)A.limits=m.limits};
  A.onWelcome=()=>{if(A.token)NET.sendRaw({t:'auth.token',token:A.token});if(A.cur)NET.sendRaw({t:'g.join',ch:A.cur});fire('conn')};
  A.onClose=()=>fire('conn');
  A.msg=m=>{switch(m.t){
    case'auth.ok':A.name=m.user.name;A.info=m.user;A.friends=m.friends||[];A.ledger=m.ledger||[];if(m.token){A.token=m.token;store.set('token',m.token)}
      applyWallet(m.user);user=A.name;signedIn=true;setUser();done(m,{ok:true});fire('auth');fire('friends');break;
    case'auth.err':if(!reqs.has(m.req)){A.token='';store.set('token','')}done(m,{ok:false,err:m.err});break;
    case'auth.out':signed(false);break;
    case'kicked':toast(m.reason);signed(false);break;
    case'friends':A.friends=m.list;fire('friends');break;
    case'friend.res':if(!NET.fail(m.req,m.err))done(m,m);break;
    case'gift.res':case'email.res':case'reset.res':case'report.res':done(m,m);break;
    case'user.update':A.info=m.user;fire('auth');break;
    case'gift.in':quiet(coins+m.amount);A.ledger.push({t:Date.now(),text:'Received '+m.amount+' coins from '+m.from});toast(m.from+' gifted you '+m.amount+' coins!');AUD.sfx('coin');fire('wallet');break;
    case'wallet.set':quiet(m.coins);toast('The server corrected your balance.');break;
    case'g.history':chan(m.ch).msgs=m.msgs.slice();fire('chat');break;
    case'g.msg':{const c=chan(m.ch);c.msgs.push({from:m.from,text:m.text,ts:m.ts});if(c.msgs.length>100)c.msgs.shift();fire('chat');break}
    case'g.count':chan(m.ch).n=m.n;fire('chat');break;
  }};
  A.register=(u,p)=>A.req({t:'auth.register',u,p,w:{coins,xp,owned,eq}});
  A.login=(u,p)=>A.req({t:'auth.login',u,p});
  A.logout=()=>{NET.sendRaw({t:'auth.logout',token:A.token});A.token='';store.set('token','');signed(false)};
  A.syncNow=()=>{clearTimeout(dt);if(A.name&&NET.online())NET.sendRaw({t:'wallet.sync',coins,xp,owned,eq})};
  ACCHOOK.dirty=()=>{if(!A.name)return;clearTimeout(dt);dt=setTimeout(A.syncNow,1500)};
  A.gift=async(to,amount)=>{A.syncNow();const r=await A.req({t:'gift',to,amount});if(r.ok){setCoins(coins-amount);A.ledger.push({t:Date.now(),text:'Gifted '+amount+' coins to '+to});fire('wallet')}return r};
  A.friend=(act,name)=>A.req({t:'friend.'+act,name});
  A.say=(ch,text)=>NET.sendRaw({t:'g.say',ch,text});
  A.join=ch=>NET.sendRaw({t:'g.join',ch});
  A.channel=chan;
  A.emailSet=email=>A.req({t:'email.set',email});A.emailVerify=code=>A.req({t:'email.verify',code});A.emailRemove=pw=>A.req({t:'email.remove',pw});
  A.resetRequest=id=>A.req({t:'reset.request',id});A.resetConfirm=(id,code,pw)=>A.req({t:'reset.confirm',id,code,pw});
  A.report=o=>A.req({t:'report',...o});
  A.isBlocked=n=>blocked.has(String(n).toLowerCase());
  A.block=n=>{blocked.set(String(n).toLowerCase(),String(n));store.set('blocked',[...blocked.values()]);fire('chat')};
  A.unblock=n=>{blocked.delete(String(n).toLowerCase());store.set('blocked',[...blocked.values()]);fire('chat')};
  A.blockedList=()=>[...blocked.values()];
  return A;
})();

/* ---------- Voice chat: peer to peer WebRTC audio, signalled through the room's RPC calls ---------- */
const VOICE=(()=>{
  const peers=new Map(),MAXP=7;let stream=null,sess=null,on=false,muted=false,ctx=null,loc=()=>0,iv=0;
  const V={get on(){return on},get muted(){return muted},lvl:0,count:()=>peers.size,has:id=>peers.has(id),isMutedFor:id=>!!(peers.get(id)&&peers.get(id).muted)};
  function meter(ms){
    try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();const an=ctx.createAnalyser();an.fftSize=512;ctx.createMediaStreamSource(ms).connect(an);const b=new Uint8Array(an.fftSize);
      return()=>{an.getByteTimeDomainData(b);let s=0;for(let i=0;i<b.length;i++){const x=(b[i]-128)/128;s+=x*x}return Math.sqrt(s/b.length)}}catch(e){return()=>0}
  }
  function mk(from){
    if(peers.has(from))return peers.get(from);
    const pc=new RTCPeerConnection({iceServers:NET.ice()}),p={pc,audio:null,lv:()=>0,level:0,q:[],muted:!!(sess&&sess.players.get(from)&&ACC.isBlocked(sess.players.get(from).name))};peers.set(from,p);
    stream.getTracks().forEach(t=>pc.addTrack(t,stream));
    pc.onicecandidate=e=>{if(e.candidate&&sess)sess.rpc('vc.ice',{c:e.candidate.toJSON()},from)};
    pc.ontrack=e=>{const a=new Audio();a.autoplay=true;a.srcObject=e.streams[0];a.muted=p.muted;p.audio=a;a.play().catch(()=>{});p.lv=meter(e.streams[0])};
    pc.onconnectionstatechange=()=>{if(pc.connectionState==='failed'||pc.connectionState==='closed')drop(from)};
    return p;
  }
  function drop(id){const p=peers.get(id);if(!p)return;peers.delete(id);try{p.pc.close()}catch(e){}if(p.audio)p.audio.srcObject=null;const q=sess&&sess.players.get(id);if(q)q.speaking=false}
  async function flush(p){for(const c of p.q.splice(0))try{await p.pc.addIceCandidate(c)}catch(e){}}
  async function offer(from){const p=mk(from);const o=await p.pc.createOffer();await p.pc.setLocalDescription(o);sess.rpc('vc.offer',{sdp:p.pc.localDescription.sdp},from)}
  V.bind=s=>{
    s.on('vc.hi',async(from,a)=>{if(!on||sess!==s)return;if(!peers.has(from)&&peers.size>=MAXP)return;if(!a||!a.r)s.rpc('vc.hi',{r:1},from);
      if(!peers.has(from)){if(NET.id<from)await offer(from);else mk(from)}});
    s.on('vc.offer',async(from,a)=>{if(!on||sess!==s||!a)return;if(!peers.has(from)&&peers.size>=MAXP)return;const p=mk(from);
      try{await p.pc.setRemoteDescription({type:'offer',sdp:a.sdp});await flush(p);const an=await p.pc.createAnswer();await p.pc.setLocalDescription(an);s.rpc('vc.answer',{sdp:p.pc.localDescription.sdp},from)}catch(e){drop(from)}});
    s.on('vc.answer',async(from,a)=>{const p=peers.get(from);if(!p||!a)return;try{await p.pc.setRemoteDescription({type:'answer',sdp:a.sdp});await flush(p)}catch(e){}});
    s.on('vc.ice',async(from,a)=>{const p=peers.get(from);if(!p||!a||!a.c)return;if(p.pc.remoteDescription){try{await p.pc.addIceCandidate(a.c)}catch(e){}}else p.q.push(a.c)});
    s.on('vc.bye',from=>drop(from));
    s.onLeave=id=>drop(id);
  };
  V.start=async s=>{
    if(on)return true;
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.RTCPeerConnection){toast('Voice chat is not supported in this browser');return false}
    try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false})}
    catch(e){toast('Could not use the microphone. Check the browser permission.');return false}
    on=true;sess=s;muted=false;loc=meter(stream);iv=setInterval(tick,120);s.rpc('vc.hi',{r:0},'others');toast('Voice on. Headphones help avoid echo.');return true;
  };
  V.stop=()=>{if(!on)return;try{if(sess)sess.rpc('vc.bye',{},'others')}catch(e){}for(const k of[...peers.keys()])drop(k);if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;on=false;clearInterval(iv);V.lvl=0;sess=null};
  V.states=()=>[...peers.values()].map(p=>p.pc.connectionState);
  V.stats=async()=>{let n=0;for(const p of peers.values()){const r=await p.pc.getStats();r.forEach(x=>{if(x.type==='inbound-rtp'&&x.kind==='audio')n+=x.bytesReceived})}return n};
  V.mute=()=>{muted=!muted;if(stream)stream.getAudioTracks().forEach(t=>{t.enabled=!muted})};
  V.muteFor=(id,f)=>{const p=peers.get(id);if(p){p.muted=f;if(p.audio)p.audio.muted=f}};
  function tick(){
    V.lvl=muted?0:loc();
    for(const[id,p]of peers){
      p.level=p.lv();const q=sess&&sess.players.get(id);if(q)q.speaking=p.level>.03&&!p.muted;
      if(p.audio){if(sess&&sess.prox&&sess.pos&&q){const d=Math.hypot(sess.pos.x-q.x,sess.pos.y-q.y);p.audio.volume=Math.max(.1,Math.min(1,1-(d-220)/900))}else p.audio.volume=1}
    }
  }
  return V;
})();

      u.maxLength=mode==='in'?120:16;p.append(u,pw);if(mode==='up')p.append(pw2);
      const err=el('p','rmsg');red(err);const go2=el('button','btn gold',mode==='in'?'Sign in':'Create account');go2.style.marginTop='12px';
      const note=connNote();if(note)err.textContent=note;
      const submit=async()=>{err.textContent='';
        if(mode==='up'&&pw.value!==pw2.value){err.textContent='The passwords do not match.';return}
        go2.disabled=true;const r=await(mode==='in'?ACC.login(u.value.trim(),pw.value):ACC.register(u.value.trim(),pw.value));go2.disabled=false;
        if(r.ok)toast(mode==='in'?'Welcome back, '+ACC.name:'Account created. Welcome, '+ACC.name+'! Add an email below so you can reset your password.');else err.textContent=r.err||'Something went wrong.'};
      go2.onclick=submit;p.addEventListener('keydown',e=>{if(e.key==='Enter')submit()});
      p.append(err,go2);
      if(mode==='in'){const fg=el('button','btn alt','Forgot password?');fg.style.cssText='margin-top:12px;margin-left:8px';fg.onclick=()=>{mode='reset';step=1;draw()};p.append(fg)}
      p.append(el('p','note',mode==='up'?'Your current coins, level and cosmetics move into the new account. Usernames are 3 to 16 letters, numbers or underscores; passwords need at least 8 characters.':'Signing in loads your saved coins, level and cosmetics from the server.'));
    }
    blockedBox(p);v.append(p);
  };
  draw();const off=ACC.on(w=>{if(w==='auth'||w==='conn'||w==='wallet')draw()});stopLoop=off;
}
function renderChat(v){
  v.append(el('h1','','Chat'),el('p','sub','Global channels shared by everyone online'));
  const p=el('div','panel');p.style.maxWidth='720px';
  const tabs=el('div','row chtabs');tabs.style.marginTop='0';
  const list=el('div','msgs'),row=el('div','row');row.style.marginTop='0';
  const inp=el('input','num');inp.style.cssText='flex:1;width:auto';inp.maxLength=60;inp.setAttribute('aria-label','Message');
  const send=el('button','btn','Send'),info=el('p','note');
  let cur=ACC.cur||ACC.chans[0];
  const pick=c=>{if(ACC.cur&&ACC.cur!==c)NET.sendRaw({t:'g.leave',ch:ACC.cur});cur=c;ACC.cur=c;ACC.join(c);draw()};
  const draw=()=>{
    tabs.innerHTML='';for(const c of ACC.chans){const b=el('button','btn'+(c===cur?'':' alt'),'# '+c+(ACC.channel(c).n?'  ('+ACC.channel(c).n+')':''));b.onclick=()=>pick(c);tabs.append(b)}
    list.innerHTML='';const msgs=ACC.channel(cur).msgs.filter(m=>!ACC.isBlocked(m.from));
    if(!msgs.length)list.append(el('p','note','No messages yet. Say hello!'));
    for(const m of msgs){const d=el('div','msg');d.style.textAlign='left';const t=el('span');t.style.cssText='color:var(--mute);font-size:12px;margin-right:8px';t.textContent=new Date(m.ts).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
      const b=el('b');b.textContent=m.from;if(m.from===ACC.name)b.style.color='var(--gold,#f2b84b)';else{b.style.cursor='pointer';b.title='Report, block or gift';b.onclick=()=>playerMenu(m.from,cur)}d.append(t,b,document.createTextNode(': '+m.text));list.append(d)}
    list.scrollTop=1e9;
    const off=!NET.online(),guest=!ACC.name;inp.disabled=send.disabled=off||guest;inp.placeholder=off?'Offline':guest?'Sign in to chat':'Message #'+cur;
    info.textContent=off?connNote():guest?'You can read along. Sign in on the Account page to talk.':'Be kind. Messages are filtered and slowed down to keep chat readable.';
  };
  const go2=()=>{const t=inp.value.trim();if(!t||!ACC.name)return;ACC.say(cur,t);inp.value=''};
  send.onclick=go2;inp.onkeydown=e=>{if(e.key==='Enter')go2()};
  row.append(inp,send);p.append(tabs,list,row,info);v.append(p);
  ACC.cur=cur;ACC.join(cur);draw();
  const off=ACC.on(w=>{if(w==='chat'||w==='auth'||w==='conn')draw()});

}

      const b=el('button','btn gold','Go to Account');b.style.marginTop='12px';b.onclick=()=>go('account');p.append(b);box.append(p);return}
    const p=el('div','panel');p.style.maxWidth='620px';
    const add=el('div','row');add.style.marginTop='0';const ni=el('input','num');ni.placeholder='Add a friend by username';ni.maxLength=16;ni.style.cssText='flex:1;width:auto';ni.setAttribute('aria-label','Friend username');

    const row=(f,btns)=>{const d=el('div','frow'),dot=el('span','fdot'+(f.online?' on':'')),g=el('div','grow'),nm=el('b');nm.textContent=f.name;const sm=el('small');
      sm.textContent=f.status==='in'?'Wants to be your friend':f.status==='out'?'Request sent':!f.online?'Offline':f.room?'In '+f.room.name+' ('+f.room.count+'/'+f.room.max+')':'Online';
      g.append(nm,sm);d.append(dot,g);btns.forEach(b=>d.append(b));return d};
    const btn=(t,cls,fn)=>{const b=el('button','btn '+cls,t);b.onclick=fn;return b};
    const call=async(act,name,msg)=>{const r=await ACC.friend(act,name);toast(r.ok?msg:r.err)};
    sec('Requests',by('in').map(f=>row(f,[btn('Accept','gold',()=>call('accept',f.name,'You are now friends with '+f.name)),btn('Decline','alt',()=>call('decline',f.name,'Request declined'))])));
    const fr=by('friend').sort((a,b)=>(b.online-a.online)||a.name.localeCompare(b.name));
    sec('Friends  ('+fr.filter(f=>f.online).length+' online)',fr.map(f=>{const bs=[];
      if(f.online&&f.room&&f.room.count<f.room.max)bs.push(btn('Join','gold',()=>{NET.pending={friend:f.name};openGame(GAMES.find(g=>g.id===(f.room.kind==='casino'?'casino':'lobby')))}));
      bs.push(btn('Gift','alt',()=>giftDialog(f.name)),btn('Remove','alt',()=>{if(confirm('Remove '+f.name+' from your friends?'))call('remove',f.name,'Friend removed')}));return row(f,bs)}));
    sec('Sent requests',by('out').map(f=>row(f,[btn('Cancel','alt',()=>call('remove',f.name,'Request cancelled'))])));
    if(!ACC.friends.length)p.append(el('p','note','No friends yet. Add someone above, or use People in the lobby to send a request.'));
    box.append(p);
  };
  draw();const off=ACC.on(w=>{if(w==='friends'||w==='auth'||w==='conn')draw()});stopLoop=off;
}

/* ---------- Sparks ---------- */
function burst(x,y,color){
  for(let i=0;i<10;i++){
    const s=el('div','spark'),a=Math.random()*6.283,d=30+Math.random()*40;
    s.style.cssText=`left:${x}px;top:${y}px;background:${color||'#f2b84b'};--dx:${Math.cos(a)*d}px;--dy:${Math.sin(a)*d}px`;
    document.body.append(s);setTimeout(()=>s.remove(),700);
  }
}

/* ---------- Gliding constellation background ---------- */
(function(){
  const cv=$('#stars'),cx=cv.getContext('2d');
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  let W,H,dpr,pts=[],mouse={x:-999,y:-999},shoot=null,next=2000;
  function size(){
    dpr=Math.min(devicePixelRatio||1,2);W=cv.width=innerWidth*dpr;H=cv.height=innerHeight*dpr;
    const n=Math.min(120,Math.round(innerWidth*innerHeight/14000));
    pts=Array.from({length:n},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.3*dpr,vy:(Math.random()-.5)*.3*dpr,r:(Math.random()*1.4+.7)*dpr}));
  }
  addEventListener('resize',size);
  addEventListener('pointermove',e=>{mouse.x=e.clientX*dpr;mouse.y=e.clientY*dpr});
  function frame(t){
    cx.clearRect(0,0,W,H);
    const L=130*dpr,M=170*dpr;
    for(const p of pts){
      if(!reduce){p.x+=p.vx;p.y+=p.vy}
      if(p.x<0)p.x=W;if(p.x>W)p.x=0;if(p.y<0)p.y=H;if(p.y>H)p.y=0;
    }
    cx.lineWidth=dpr;
    for(let i=0;i<pts.length;i++){
      const a=pts[i];
      for(let j=i+1;j<pts.length;j++){
        const b=pts[j],d=Math.hypot(a.x-b.x,a.y-b.y);
        if(d<L){cx.strokeStyle=`rgba(140,180,255,${(1-d/L)*.4})`;cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(b.x,b.y);cx.stroke()}
      }
      const dm=Math.hypot(a.x-mouse.x,a.y-mouse.y);
      if(dm<M){cx.strokeStyle=`rgba(242,184,75,${(1-dm/M)*.6})`;cx.beginPath();cx.moveTo(a.x,a.y);cx.lineTo(mouse.x,mouse.y);cx.stroke()}
      cx.fillStyle='rgba(205,225,255,.9)';cx.beginPath();cx.arc(a.x,a.y,a.r,0,6.283);cx.fill();
    }
    if(!reduce){
      if(!shoot&&t>next){shoot={x:Math.random()*W*.6,y:Math.random()*H*.4,vx:10*dpr,vy:4*dpr,life:1};next=t+4000+Math.random()*5000}
      if(shoot){
        const s=shoot;s.x+=s.vx;s.y+=s.vy;s.life-=.02;
        cx.strokeStyle=`rgba(255,236,190,${Math.max(s.life,0)})`;cx.lineWidth=2*dpr;
        cx.beginPath();cx.moveTo(s.x,s.y);cx.lineTo(s.x-s.vx*7,s.y-s.vy*7);cx.stroke();
        if(s.life<=0)shoot=null;
      }
      requestAnimationFrame(frame);
    }
  }
  size();requestAnimationFrame(frame);
})();
